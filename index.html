<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7eedf;
            background-image: 
                linear-gradient(rgba(224, 211, 192, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(224, 211, 192, 0.4) 1px, transparent 1px);
            background-size: 20px 20px; color: #2b1f1d;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            overflow-x: hidden; /* 彻底防止横向滚动条 */
        }
        .container {
            width: 100%; max-width: 380px; background: #fffdf9;
            padding: 40px 20px 30px; border-radius: 32px;
            border: 4px solid #2b1f1d; box-shadow: 8px 8px 0px #cfbda3;
            text-align: center; position: relative; z-index: 10;
        }
        h1 { font-size: 28px; color: #cc4c33; letter-spacing: 2px; font-weight: 900; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #7b6865; margin-bottom: 40px; font-weight: 500; }
        
        /* 摇签区域 */
        .cylinder-wrapper {
            height: 280px; position: relative; margin-bottom: 30px;
            display: flex; justify-content: center; align-items: flex-end;
        }
        .stick-container {
            position: absolute; bottom: 110px; width: 140px; height: 130px;
            display: flex; justify-content: center; align-items: flex-end;
        }
        .stick {
            width: 35px; height: 110px; background-color: #f5cf82; border: 3px solid #2b1f1d;
            border-radius: 8px 8px 0 0; margin: 0 -10px; transform-origin: bottom center;
            position: relative; box-shadow: -2px 0 0px #2b1f1d;
        }
        .stick::before {
            content: ''; position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%); width: 6px; height: 6px;
            background-color: #2b1f1d; border-radius: 50%;
        }
        .stick:nth-child(1) { transform: rotate(-15deg) translateY(5px); background-color: #e8bd68; }
        .stick:nth-child(2) { transform: rotate(-7deg) translateY(-2px); background-color: #f7d692; }
        .stick:nth-child(3) { transform: rotate(-2deg) translateY(3px); background-color: #eed08a; }
        .stick:nth-child(4) { transform: rotate(5deg) translateY(-5px); background-color: #f5cf82; }
        .stick:nth-child(5) { transform: rotate(12deg) translateY(2px); background-color: #e5b85c; }

        .cylinder {
            width: 150px; height: 140px; background-color: #e85d44; border: 4px solid #2b1f1d;
            border-radius: 16px 16px 28px 28px; position: relative; z-index: 12;
            box-shadow: 5px 5px 0px #2b1f1d; display: flex; justify-content: center; align-items: center;
        }
        .cylinder::after {
            content: '万事皆宜'; position: absolute; padding: 8px 4px;
            background-color: #ffca3a; border: 3px solid #2b1f1d; border-radius: 6px;
            color: #2b1f1d; font-weight: 900; font-size: 15px;
            writing-mode: vertical-rl; text-orientation: upright;
            letter-spacing: 2px; box-shadow: 3px 3px 0 #2b1f1d;
        }

        .lucky-stick-out {
            position: absolute; width: 45px; height: 150px; background-color: #118ab2;
            border: 4px solid #2b1f1d; bottom: 110px; z-index: 5;
            border-radius: 12px 12px 6px 6px; display: none;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15); transform-origin: center;
        }
        .lucky-stick-out::before {
            content: ''; position: absolute; top: 12px; left: 50%;
            transform: translateX(-50%); width: 8px; height: 8px;
            background-color: #2b1f1d; border-radius: 50%;
        }
        .lucky-stick-text {
            writing-mode: vertical-rl; text-orientation: upright; font-size: 13px;
            color: #fff; font-weight: 900; margin: 32px auto 0 auto; letter-spacing: 4px;
        }

        /* 动画群 */
        @keyframes handShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 6px) rotate(-14deg); }
            40% { transform: translate(10px, -4px) rotate(12deg); }
            60% { transform: translate(-10px, -2px) rotate(-10deg); }
            80% { transform: translate(8px, 4px) rotate(8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shaking { animation: handShake 0.4s ease-in-out infinite; }

        @keyframes stickBumpy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-25px) rotate(-12deg); }
            66% { transform: translateY(5px) rotate(15deg); }
        }
        .sticks-shaking .stick { animation: stickBumpy 0.35s ease-in-out infinite; }
        .sticks-shaking .stick:nth-child(even) { animation-delay: 0.1s; }

        @keyframes signFlyOut {
            0% { bottom: 110px; opacity: 0; transform: scale(0.6) rotate(-45deg); }
            60% { bottom: 230px; opacity: 1; transform: scale(1.1) rotate(15deg); }
            100% { bottom: 190px; opacity: 1; transform: scale(1) rotate(5deg); }
        }
        .fly-out-anim { display: block !important; animation: signFlyOut 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* 全屏均匀分布的飘字动画 */
        @keyframes textFloatUp {
            0% { transform: translateY(0) scale(0.7); opacity: 0; }
            15% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            80% { opacity: 0.9; }
            100% { transform: translateY(-220px) scale(0.95); opacity: 0; }
        }
        .floating-text {
            position: fixed;
            color: #cc4c33; font-weight: 900; font-size: 18px;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #2b1f1d;
            pointer-events: none; /* 关键：防止阻挡按钮点击 */
            z-index: 999;
            animation: textFloatUp 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            display: flex; align-items: center; gap: 4px;
            white-space: nowrap;
        }
        /* 金元宝专属色彩 */
        .gold-style {
            color: #ffa200 !important;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #b25900 !important;
        }
        /* 福字好运专属色彩 */
        .luck-style {
            color: #ff3333 !important;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #5c0000 !important;
        }

        .btn-draw {
            background-color: #ff6b6b; color: #fff; border: 4px solid #2b1f1d;
            padding: 14px 40px; font-size: 18px; font-weight: 900; border-radius: 20px;
            cursor: pointer; box-shadow: 4px 4px 0px #2b1f1d; letter-spacing: 2px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.1s;
        }
        .btn-draw:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px #2b1f1d; }
        .btn-draw:disabled { background-color: #cbd5e1; color: #94a3b8; box-shadow: none; transform: none; }

        .result-box {
            margin-top: 30px; min-height: 140px; padding: 22px 18px; border-radius: 20px;
            background-color: #fdfcf7; border: 3px solid #2b1f1d; box-shadow: 4px 4px 0px #eedcc5;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .result-title { font-size: 13px; font-weight: 700; color: #7b6865; margin-bottom: 8px; }
        .result-value { font-size: 26px; font-weight: 900; color: #cc4c33; margin-bottom: 4px; }
        .result-tag { font-size: 11px; background: #cc4c33; color: #fff; padding: 2px 8px; border-radius: 20px; font-weight: bold; margin-bottom: 12px; display: none; letter-spacing: 1px; }
        .result-compliment { font-size: 14px; color: #4a3532; font-weight: 700; line-height: 1.6; background-color: #fff5e6; padding: 10px 14px; border-radius: 12px; border: 2px dashed #2b1f1d; max-width: 95%; text-align: left; }
        
        .result-mission { font-size: 12px; color: #118ab2; font-weight: 700; margin-top: 10px; border-top: 1px dotted #cbd5e1; padding-top: 8px; width: 95%; text-align: left; display: none; }
        .result-midnight { font-size: 11px; color: #7b6865; font-weight: 500; margin-top: 8px; font-style: italic; display: none; line-height: 1.4; }
        .hint-text { font-size: 11px; color: #a3908c; margin-top: 15px; font-weight: 500; line-height: 1.5; }
        .almanac-text { font-size: 11px; color: #cc4c33; margin-top: 4px; font-weight: 700; }
    </style>
</head>

        const screenHeight = window.innerHeight;
        let leftPos = 0;

        // 增加了更安全的边距扣除，绝不超出边界
        if (sideToggle) {
            leftPos = Math.random() * (screenWidth * 0.3) + 10;
        } else {
            leftPos = Math.random() * (screenWidth * 0.3) + (screenWidth * 0.65) - 40;
        }
        sideToggle = !sideToggle;

        let topPos = (screenHeight * 0.45) + (Math.random() * 80);

        textSpan.style.left = leftPos + 'px';
        textSpan.style.top = topPos + 'px';

        document.body.appendChild(textSpan);
        setTimeout(() => textSpan.remove(), 1200);
    }

    function startDraw() {
        clickTimeBuffer.push(Date.now());
        totalDrawsInShortTime++;

        const wrapper = document.getElementById('wrapper');
        const stickContainer = document.getElementById('stickContainer');
        const luckyStick = document.getElementById('luckyStick');
        const luckyStickText = document.getElementById('luckyStickText');
        const drawBtn = document.getElementById('drawBtn');
        const resultTitle = document.getElementById('resultTitle');
        const resultValue = document.getElementById('resultValue');
        const resultTag = document.getElementById('resultTag');
        const resultComp = document.getElementById('resultCompliment');
        const resultMission = document.getElementById('resultMission');
        const resultMidnight = document.getElementById('resultMidnight');

        luckyStick.classList.remove('fly-out-anim');
        resultTitle.innerText = "灵签演道通玄奥，宝箓含神赐福祥...";
        resultValue.innerText = "⚡";
        resultTag.style.display = "none";
        resultComp.style.display = "none";
        resultMission.style.display = "none";
        resultMidnight.style.display = "none";
        drawBtn.disabled = true;

        wrapper.classList.add('shaking');
        stickContainer.classList.add('sticks-shaking');

        const intervalTime = clickTimeBuffer.length > 5 ? 100 : 160;
        const floatTimer = setInterval(createFloatingText, intervalTime);

        setTimeout(() => {
            clearInterval(floatTimer);
            wrapper.classList.remove('shaking');
            stickContainer.classList.remove('sticks-shaking');

            const poolResult = getAvailablePool();
            
            if (poolResult.status === "sunday_rest") {
                luckyStickText.innerText = "偷懒大吉";
                luckyStick.classList.add('fly-out-anim');
                setTimeout(() => {
                    resultTitle.innerText = "💤 【祖师爷偏心提示】";
                    resultValue.innerText = "今天放假，偷懒无罪！";
                    resultTag.innerText = "【神仙放假·特别定制签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = "✨ 今天是周日，天地磁场都在劝你理直气壮地躺平。不准焦虑、不准自我CPU，今天最大的任务就是把舒适度拉满，做个快乐的闲人！";
                    resultComp.style.display = "block";
                    drawBtn.innerText = "再摇一次功德";
                    drawBtn.style.backgroundColor = "#ffca3a"; drawBtn.style.color = "#2b1f1d";
                    drawBtn.disabled = false;
                }, 300);
                return;
            }

            const currentPool = poolResult.data;
            const randomIndex = Math.floor(Math.random() * currentPool.length);
            let finalResult = currentPool[randomIndex];

            if (finalResult === lastResult) {
                repeatCount++;
            } else {
                repeatCount = 1;
                lastResult = finalResult;
            }

            luckyStickText.innerText = luckyIdioms[finalResult] || "今日宜行";
            luckyStick.classList.add('fly-out-anim');

            setTimeout(() => {
                if (repeatCount >= 3) {
                    resultTitle.innerText = "🔮 【抓包！命中注定的天意】";
                    resultValue.innerText = `${finalResult} (第${repeatCount}次)`;
                    resultTag.innerText = "【天道金牌·退无可退签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = `🤣 怎么又是【${finalResult}】？！本签筒都已经尽力帮你打乱顺序了，结果还是它！别嘴硬和抵抗啦，这就是命中注定的选择。赶紧收拾收拾，顺应天意高调出发！`;
                    resultComp.style.display = "block";
                } 
                else if (totalDrawsInShortTime >= 5) {
                    resultTitle.innerText = "👑 【天道强制特赦令】";
                    resultValue.innerText = `${finalResult}`;
                    resultTag.innerText = "【直接盲选·终结纠结签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = `👀 别再挑啦！祖师爷看你反复摇晃了 ${totalDrawsInShortTime} 次，代表你的纠结磁场快超标了！现在听话，不要想了，闭眼选【${finalResult}】作为你的终极答案，立刻出发去迎接快乐！`;
                    resultComp.style.display = "block";
                } 
                else {
                    resultTitle.innerText = "🎉 乾坤定夺！今日宜 ——";
                    resultValue.innerText = `${finalResult}`;
                    resultTag.innerText = signTags[finalResult] || "【天赐上上签】";
                    resultTag.style.display = "inline-block";
                    
                    const compList = compliments[finalResult];
                    resultComp.innerText = compList[Math.floor(Math.random() * compList.length)];
                    resultComp.style.display = "block";
                }

                resultMission.innerText = missionPool[Math.floor(Math.random() * missionPool.length)];
                resultMission.style.display = "block";

                const now = new Date();
                if (now.getHours() >= 23 || now.getHours() < 5) {
                    resultMidnight.innerText = "🌙 (悄悄话：现在已经是深夜啦。不管今天摇到了去哪儿，现在的首要任务是盖好被子睡觉觉。明天睡醒了，好运自会陪你一同出发。晚安，全世界最棒的你。)";
                    resultMidnight.style.display = "block";
                }
                
                drawBtn.innerText = "不服气，再请一签";
                drawBtn.style.backgroundColor = "#4caf50"; drawBtn.style.color = "#fff";
                drawBtn.disabled = false;
            }, 300);

        }, 1100);
    }

    setInterval(() => { totalDrawsInShortTime = 0; }, 300000);
    updateTimeHint();
    setInterval(updateTimeHint, 60000);
</script>

</body>
</html>
