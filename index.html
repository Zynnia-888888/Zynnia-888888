<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵犀启运上上签</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7eedf;
            background-image: 
                linear-gradient(rgba(224, 211, 192, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(224, 211, 192, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #fffdf9;
            padding: 40px 20px 30px;
            border-radius: 32px;
            border: 4px solid #2b1f1d;
            box-shadow: 8px 8px 0px #cfbda3;
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 28px;
            color: #cc4c33;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: #7b6865;
            margin-bottom: 40px;
            font-weight: 500;
        }
        
        /* 摇签区域 */
        .cylinder-wrapper {
            height: 280px;
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .stick-container {
            position: absolute;
            bottom: 110px;
            width: 140px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .stick {
            width: 35px;
            height: 110px;
            background-color: #f5cf82;
            border: 3px solid #2b1f1d;
            border-radius: 8px 8px 0 0;
            margin: 0 -10px;
            transform-origin: bottom center;
            position: relative;
            box-shadow: -2px 0 0px #2b1f1d;
        }
        .stick::before {
            content: '';
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 6px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }
        
        .stick:nth-child(1) { transform: rotate(-15deg) translateY(5px); background-color: #e8bd68; }
        .stick:nth-child(2) { transform: rotate(-7deg) translateY(-2px); background-color: #f7d692; }
        .stick:nth-child(3) { transform: rotate(-2deg) translateY(3px); background-color: #eed08a; }
        .stick:nth-child(4) { transform: rotate(5deg) translateY(-5px); background-color: #f5cf82; }
        .stick:nth-child(5) { transform: rotate(12deg) translateY(2px); background-color: #e5b85c; }

        .cylinder {
            width: 150px;
            height: 140px;
            background-color: #e85d44;
            border: 4px solid #2b1f1d;
            border-radius: 16px 16px 28px 28px;
            position: relative;
            z-index: 10;
            box-shadow: 5px 5px 0px #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cylinder::after {
            content: '万事皆宜';
            position: absolute;
            padding: 8px 4px;
            background-color: #ffca3a;
            border: 3px solid #2b1f1d;
            border-radius: 6px;
            color: #2b1f1d;
            font-weight: 900;
            font-size: 15px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            box-shadow: 3px 3px 0 #2b1f1d;
        }

        .lucky-stick-out {
            position: absolute;
            width: 45px;
            height: 150px;
            background-color: #118ab2;
            border: 4px solid #2b1f1d;
            bottom: 110px;
            z-index: 5;
            border-radius: 12px 12px 6px 6px;
            display: none;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            transform-origin: center;
        }
        .lucky-stick-out::before {
            content: '';
            position: absolute;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 8px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }
        .lucky-stick-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 13px;
            color: #fff;
            font-weight: 900;
            margin: 32px auto 0 auto;
            letter-spacing: 4px;
        }

        /* 动画群 */
        @keyframes handShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 6px) rotate(-14deg); }
            40% { transform: translate(10px, -4px) rotate(12deg); }
            60% { transform: translate(-10px, -2px) rotate(-10deg); }
            80% { transform: translate(8px, 4px) rotate(8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shaking { animation: handShake 0.4s ease-in-out infinite; }

        @keyframes stickBumpy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-25px) rotate(-12deg); }
            66% { transform: translateY(5px) rotate(15deg); }
        }
        .sticks-shaking .stick { animation: stickBumpy 0.35s ease-in-out infinite; }
        .sticks-shaking .stick:nth-child(even) { animation-delay: 0.1s; }

        @keyframes 牌飞出 {
            0% { bottom: 110px; opacity: 0; transform: scale(0.6) rotate(-45deg); }
            60% { bottom: 230px; opacity: 1; transform: scale(1.1) rotate(15deg); }
            100% { bottom: 190px; opacity: 1; transform: scale(1) rotate(5deg); }
        }
        .fly-out-anim {
            display: block !important;
            animation: 牌飞出 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 基础组件 */
        .btn-draw {
            background-color: #ff6b6b;
            color: #fff;
            border: 4px solid #2b1f1d;
            padding: 14px 50px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #2b1f1d;
            letter-spacing: 2px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-draw:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #2b1f1d;
        }
        .btn-draw:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .result-box {
            margin-top: 30px;
            min-height: 140px;
            padding: 20px;
            border-radius: 20px;
            background-color: #fdfcf7;
            border: 3px solid #2b1f1d;
            box-shadow: 4px 4px 0px #eedcc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .result-title {
            font-size: 13px;
            font-weight: 700;
            color: #7b6865;
            margin-bottom: 8px;
        }
        .result-value {
            font-size: 26px;
            font-weight: 900;
            color: #cc4c33;
            margin-bottom: 12px;
        }
        .result-compliment {
            font-size: 14px;
            color: #4a3532;
            font-weight: 700;
            line-height: 1.6;
            background-color: #fff5e6;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px dashed #2b1f1d;
            max-width: 95%;
            text-align: left;
        }
        .hint-text {
            font-size: 11px;
            color: #a3908c;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

        <div class="lucky-stick-out" id="luckyStick">
            <div class="lucky-stick-text">今日宜行</div>
        </div>
        <div class="cylinder" id="cylinderBox"></div>

    <button class="btn-draw" id="drawBtn" onclick="startDraw()">大力摇晃</button>

    <div class="result-box">
        <div id="resultTitle" class="result-title">心诚则灵，答案自现</div>
        <div id="resultValue" class="result-value">✏️</div>

    <div class="hint-text" id="timeHint"></div>
</div>

    function updateTimeHint() {
        const now = new Date();
        const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        document.getElementById('timeHint').innerText = `当前系统时间：${days[now.getDay()]} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }
    
    function getAvailablePool() {
        const now = new Date();
        const dayOfWeek = now.getDay(); 
        const currentHour = now.getHours();

        if (dayOfWeek === 0) {
            return { status: "empty", reason: "周日默认大休息！老实躺平充电吧~" };
        }

        let pool = [
            "请假休息", "随便转转", "公园散步", "巡视果园", 
            "宿舍躺平", "IDEA", "老Maxi", "新Maxi", 
            "Lilly", "DM", "明珠", "二楼中超, "明珠, "银行取钱"
        ];

        if (dayOfWeek >= 3 && dayOfWeek <= 6) { pool.push("Lidl"); }
        if (currentHour < 14) { pool.push("瓜果市场"); }

        return { status: "ready", data: pool };
    }

    function startDraw() {
        const wrapper = document.getElementById('wrapper');
        const stickContainer = document.getElementById('stickContainer');
        const luckyStick = document.getElementById('luckyStick');
        const drawBtn = document.getElementById('drawBtn');
        const resultTitle = document.getElementById('resultTitle');
        const resultValue = document.getElementById('resultValue');
        const resultComp = document.getElementById('resultCompliment');

        luckyStick.classList.remove('fly-out-anim');
        resultTitle.innerText = "灵签演道通玄奥，宝箓含神赐福祥...";
        resultValue.innerText = "⚡";
        resultComp.style.display = "none";
        drawBtn.disabled = true;

        wrapper.classList.add('shaking');
        stickContainer.classList.add('sticks-shaking');

        setTimeout(() => {
            wrapper.classList.remove('shaking');
            stickContainer.classList.remove('sticks-shaking');

            const poolResult = getAvailablePool();
            
            if (poolResult.status === "empty") {
                resultTitle.innerText = "💤 【今日闭筒】";
                resultValue.innerText = poolResult.reason;
                drawBtn.disabled = false;
                return;
            }

            const currentPool = poolResult.data;
            const randomIndex = Math.floor(Math.random() * currentPool.length);
            const finalResult = currentPool[randomIndex];

            luckyStick.classList.add('fly-out-anim');

            setTimeout(() => {
                resultTitle.innerText = "🎉 乾坤定夺！今日宜 ——";
                resultValue.innerText = `${finalResult}`;
                
                // 抽取对应地点的专属无标签彩虹屁
                const compList = compliments[finalResult];
                const randomCompIndex = Math.floor(Math.random() * compList.length);
                
                resultComp.innerText = compList[randomCompIndex];
                resultComp.style.display = "block";
                
                drawBtn.disabled = false;
            }, 300);

        }, 1100);
    }

    updateTimeHint();
    setInterval(updateTimeHint, 60000);
</script>

</body>
</html>
