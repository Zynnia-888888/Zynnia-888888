<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时来运转</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.5s ease;
        }

        /* 金色隐藏皮肤下的全景视口变换 */
        body.golden-easter-egg {
            background-color: #f3e6be;
        }

        /* 核心：固化的手机端独立圆弧视觉框 */
        .phone-viewport {
            width: 100%;
            max-width: 412px; /* 经典手机端标准视觉宽度 */
            height: 94vh;
            max-height: 860px;
            /* 核心修改：移除原有的格子底纹，统一为当前的纯白色 */
            background-color: #ffffff;
            
            /* 完美的手机卡片倒角与硬核边缘切裁 */
            border-radius: 36px;
            border: 6px solid #2b1f1d;
            box-shadow: 0 20px 50px rgba(43, 31, 29, 0.25), 12px 12px 0px #cfbda3;
            position: relative;
            overflow: hidden; /* 核心：确保所有动效粒子、签条不溢出圆弧框 */
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }

        .golden-easter-egg .phone-viewport {
            /* 金色模式下也统一去除格子，保持纯白色 */
            background-color: #ffffff;
            border-color: #8c6200;
            box-shadow: 0 20px 50px rgba(140, 98, 0, 0.2), 12px 12px 0px #e0ca9b;
        }

        /* 视口内部的平滑滚动容器 */
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px 30px;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* 确保内部完全纯白 */
            
            /* 隐藏滚动条但保留功能 */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* 内部核心纸卡片 */
        .container {
            width: 100%;
            background: #fffdf9;
            padding: 25px 16px 20px;
            border-radius: 24px;
            border: 4px solid #2b1f1d;
            box-shadow: 5px 5px 0px #cfbda3;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }
        
        .phone-viewport.golden-mode .container {
            border-color: #8c6200;
            background: #fffdf2;
            box-shadow: 5px 5px 0px #e0ca9b;
        }

        /* 文案去编程化：标题更新 */
        h1 {
            font-size: 26px;
            color: #cc4c33;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 6px;
            transition: color 0.5s;
        }
        
        .phone-viewport.golden-mode h1 {
            color: #b8860b;
        }

        .subtitle {
            font-size: 13px;
            color: #7b6865;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        /* 摇签区域 - 严格中轴线对称设计 */
        .cylinder-wrapper {
            height: 270px;
            position: relative;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 绝对居中对齐 */
        .stick-container {
            position: absolute;
            bottom: 110px;
            width: 140px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.4s ease;
        }

        .stick {
            width: 35px;
            height: 110px;
            background-color: #f5cf82;
            border: 3px solid #2b1f1d;
            border-radius: 8px 8px 0 0;
            margin: 0 -8px;
            transform-origin: bottom center;
            position: relative;
            box-shadow: -1px 0 0px #2b1f1d;
            transition: all 0.5s;
        }

        .phone-viewport.golden-mode .stick {
            border-color: #8c6200;
            background-color: #f7dfa6;
        }

        .stick::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }

        .phone-viewport.golden-mode .stick::before {
            background-color: #8c6200;
        }

        /* 严格中轴线对称旋转偏角 */
        .stick:nth-child(1) { transform: rotate(-14deg) translateY(4px); background-color: #e8bd68; }
        .stick:nth-child(2) { transform: rotate(-7deg) translateY(-2px); background-color: #f7d692; }
        .stick:nth-child(3) { transform: rotate(0deg) translateY(2px); background-color: #eed08a; z-index: 6; }
        .stick:nth-child(4) { transform: rotate(7deg) translateY(-2px); background-color: #f5cf82; }
        .stick:nth-child(5) { transform: rotate(14deg) translateY(4px); background-color: #e5b85c; }

        .cylinder {
            width: 150px;
            height: 140px;
            background-color: #e85d44;
            border: 4px solid #2b1f1d;
            border-radius: 16px 16px 28px 28px;
            position: relative;
            z-index: 12;
            box-shadow: 5px 5px 0px #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s;
            margin: 0 auto;
        }
        
        .phone-viewport.golden-mode .cylinder {
            background-color: #d4af37;
            border-color: #8c6200;
            box-shadow: 5px 5px 0px #8c6200;
        }

        .cylinder::after {
            content: '万事皆宜';
            position: absolute;
            padding: 8px 4px;
            background-color: #ffca3a;
            border: 3px solid #2b1f1d;
            border-radius: 6px;
            color: #2b1f1d;
            font-weight: 900;
            font-size: 15px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            box-shadow: 3px 3px 0 #2b1f1d;
            transition: all 0.5s;
        }
        
        .phone-viewport.golden-mode .cylinder::after {
            content: '提包跑路';
            background-color: #fff;
            border-color: #8c6200;
            color: #8c6200;
            box-shadow: 3px 3px 0 #8c6200;
        }

        /* 出签动画中轴线定位修正 */
        .lucky-stick-out {
            position: absolute;
            width: 45px;
            height: 150px;
            background-color: #118ab2;
            border: 4px solid #2b1f1d;
            bottom: 110px;
            z-index: 5;
            border-radius: 12px 12px 6px 6px;
            display: none;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            transform-origin: bottom center;
            left: 50%;
            margin-left: -22.5px; /* 宽度45px的一半，实现完美中轴居中飞出 */
        }
        
        .lucky-stick-out::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }

        .lucky-stick-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 13px;
            color: #fff;
            font-weight: 900;
            margin: 32px auto 0 auto;
            letter-spacing: 4px;
        }

        /* 动画群 */
        @keyframes handShake {
            0% { transform: translate(-50%, 0) rotate(0deg); }
            20% { transform: translate(calc(-50% - 8px), 4px) rotate(-10deg); }
            40% { transform: translate(calc(-50% + 8px), -4px) rotate(10deg); }
            60% { transform: translate(calc(-50% - 6px), -2px) rotate(-8deg); }
            80% { transform: translate(calc(-50% + 6px), 2px) rotate(8deg); }
            100% { transform: translate(-50%, 0) rotate(0deg); }
        }
        
        .shaking { 
            animation: handShake 0.4s ease-in-out infinite; 
        }

        @keyframes stickBumpy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(-8deg); }
            66% { transform: translateY(4px) rotate(10deg); }
        }
        
        .sticks-shaking .stick:nth-child(1) { animation: stickBumpy 0.35s ease-in-out infinite; }
        .sticks-shaking .stick:nth-child(2) { animation: stickBumpy 0.35s ease-in-out infinite 0.07s; }
        .sticks-shaking .stick:nth-child(3) { animation: stickBumpy 0.35s ease-in-out infinite 0.14s; }
        .sticks-shaking .stick:nth-child(4) { animation: stickBumpy 0.35s ease-in-out infinite 0.21s; }
        .sticks-shaking .stick:nth-child(5) { animation: stickBumpy 0.35s ease-in-out infinite 0.28s; }

        @keyframes signFlyOut {
            0% { bottom: 110px; opacity: 0; transform: scale(0.6) rotate(-15deg); }
            60% { bottom: 230px; opacity: 1; transform: scale(1.1) rotate(5deg); }
            100% { bottom: 190px; opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        .fly-out-anim {
            display: block !important;
            animation: signFlyOut 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 基于手机视觉框内部定位的飘字动画 */
        @keyframes textFloatUp {
            0% { transform: translateY(0) scale(0.7); opacity: 0; }
            15% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            80% { opacity: 0.9; }
            100% { transform: translateY(-220px) scale(0.95); opacity: 0; }
        }
        
        .floating-text {
            position: absolute;
            color: #cc4c33;
            font-weight: 900;
            font-size: 17px;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #2b1f1d;
            pointer-events: none;
            z-index: 999;
            animation: textFloatUp 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .gold-style {
            color: #ffa200 !important;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #b25900 !important;
        }
        
        .luck-style {
            color: #ff3333 !important;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #5c0000 !important;
        }

        .btn-draw {
            background-color: #ff6b6b;
            color: #fff;
            border: 4px solid #2b1f1d;
            padding: 13px 40px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #2b1f1d;
            letter-spacing: 2px;
            transition: all 0.2s;
            width: 100%;
            margin-top: 15px;
        }
        
        .btn-draw:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #2b1f1d;
        }
        
        .btn-draw:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            transform: none;
            border-color: #94a3b8;
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 25px;
            min-height: 140px;
            padding: 20px 16px;
            border-radius: 20px;
            background-color: #fdfcf7;
            border: 3px solid #2b1f1d;
            box-shadow: 4px 4px 0px #eedcc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .result-box.show {
            opacity: 1;
        }

        .result-title {
            font-size: 13px;
            font-weight: 700;
            color: #7b6865;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 25px;
            font-weight: 900;
            color: #cc4c33;
            margin-bottom: 4px;
        }

        .result-tag {
            font-size: 11px;
            background: #cc4c33;
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .result-compliment {
            font-size: 13px;
            color: #4a3532;
            font-weight: 700;
            line-height: 1.6;
            background-color: #fff5e6;
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px dashed #2b1f1d;
            max-width: 98%;
            text-align: left;
        }

        .hint-text {
            font-size: 11px;
            color: #a3908c;
            margin-top: 15px;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
        }

        .almanac-text {
            font-size: 11px;
            color: #cc4c33;
            margin-top: 4px;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="phone-viewport" id="phoneViewport">
        <div class="scroll-container">
            
            <div class="container">
                <h1 id="mainTitle">向阳而生随心签</h1>
                <div class="subtitle">顺风顺水 · 诸事皆宜 · 舒心相伴</div>

                <div class="cylinder-wrapper" id="cylinderWrapper">
                    <div class="stick-container" id="stickContainer">
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                        <div class="stick"></div>
                    </div>
                    <div class="cylinder" id="cylinder"></div>
                    
                    <div class="lucky-stick-out" id="luckyStickOut">
                        <div class="lucky-stick-text" id="luckyStickText">上上签</div>
                    </div>
                </div>

                <button class="btn-draw" id="btnDraw">虔诚摇签</button>

                <div class="result-box" id="resultBox">
                    <div class="result-title">今日运势主签</div>
                    <div class="result-value" id="resValue">？?？</div>
                    <div class="result-tag" id="resTag">未知</div>
                    <div class="result-compliment" id="resCompliment">摇签后解锁好运指引...</div>
                </div>

                <div class="hint-text">凝聚心神，点击上方按钮开始摇签</div>
                <div class="almanac-text">保持微笑，向着光芒前行，百无禁忌</div>
            </div>

        </div>
    </div>

    <script>
        /* 核心修复：
           1. 移除全部跟编程、程序员、Bug 相关的字眼。
           2. 彻底打破 IDEA 锁定逻辑，采用严格的独立真·随机算法。
        */
        const fortunes = [
            {
                value: "妙想连篇",
                tag: "上上签",
                compliment: "现正值晨间高效工作黄金期！虽然抽到了这个，但祖师爷还是悄悄暗示你用【IDEA】开启你无敌的逻辑风暴哦！",
                isIdea: true
            },
            {
                value: "破竹之势",
                tag: "吉签",
                compliment: "午后能量攻坚战时间！打起精神，积蓄已久的创意正在悄悄萌发，一会儿别忘了展现你雷厉风行的执行力，大杀四方，今晚准时下班！",
                isIdea: false
            },
            {
                value: "事半功倍",
                tag: "上吉",
                compliment: "思维从未如此清晰，烦人的杂事在你的统筹下将被一扫而空，完美的节奏正掌握在你的手中！",
                isIdea: false
            },
            {
                value: "迎刃而解",
                tag: "特吉",
                compliment: "今日直觉极佳！原本看似一团乱麻的复杂问题将被你轻松识破并瞬间理顺，一切发展得顺理成章。",
                isIdea: false
            },
            {
                value: "顺心遂意",
                tag: "大吉",
                compliment: "周遭磁场大好，人际与琐事皆处于最佳舒适圈。抛开顾虑，今天大可尽情去做你想做的决定。",
                isIdea: false
            }
        ];

        const btnDraw = document.getElementById('btnDraw');
        const stickContainer = document.getElementById('stickContainer');
        const luckyStickOut = document.getElementById('luckyStickOut');
        const luckyStickText = document.getElementById('luckyStickText');
        const resultBox = document.getElementById('resultBox');
        const resValue = document.getElementById('resValue');
        const resTag = document.getElementById('resTag');
        const resCompliment = document.getElementById('resCompliment');

        btnDraw.addEventListener('click', () => {
            // 禁用按钮防连击
            btnDraw.disabled = true;
            
            // 隐藏上一轮残留的结果
            resultBox.classList.remove('show');
            luckyStickOut.classList.remove('fly-out-anim');

            // 触发动态摇摆
            stickContainer.classList.add('shaking', 'sticks-shaking');

            // 倒计时结束进行抽取
            setTimeout(() => {
                stickContainer.classList.remove('shaking', 'sticks-shaking');

                // 【真·随机算法】：百分百独立计算
                const randomIndex = Math.floor(Math.random() * fortunes.length);
                const drawResult = fortunes[randomIndex];

                // 注入并飞出签条
                luckyStickText.innerText = drawResult.value;
                luckyStickOut.classList.add('fly-out-anim');

                // 呈现结果面板
                setTimeout(() => {
                    resValue.innerText = drawResult.value;
                    resTag.innerText = drawResult.tag;
                    resCompliment.innerText = drawResult.compliment;
                    
                    resTag.style.display = 'inline-block';
                    resultBox.classList.add('show');
                    
                    // 按钮恢复可用
                    btnDraw.disabled = false;
                }, 400);

            }, 1000);
        });
    </script>
</body>
</html>
