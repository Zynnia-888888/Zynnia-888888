<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>时来运转</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 全局大背景：作为手机外壳的承托环境 */
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #ede2d1;
            background-image: 
                linear-gradient(rgba(215, 201, 180, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(215, 201, 180, 0.5) 1px, transparent 1px);
            background-size: 30px 30px; 
            color: #2b1f1d;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            overflow: hidden; /* 阻止外层视口产生双滚动条 */
            transition: background-color 0.5s ease;
        }

        /* 核心：倒角圆弧框（唯一的外围框） */
        .phone-viewport {
            width: 100%;
            max-width: 412px; /* 经典手机端标准视觉宽度 */
            height: 94vh;
            max-height: 860px;
            background-color: #f7eedf;
            background-image: 
                linear-gradient(rgba(224, 211, 192, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(224, 211, 192, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            
            /* 完美的手机卡片倒角与硬核边缘切裁 */
            border-radius: 36px;
            border: 6px solid #2b1f1d; 
            box-shadow: 0 20px 50px rgba(43, 31, 29, 0.25), 12px 12px 0px #cfbda3;
            
            position: relative;
            overflow: hidden; /* 核心：确保所有动效粒子、签条不溢出圆弧框 */
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }
        
        /* 金色隐藏皮肤下的全景视口变换 */
        body.golden-easter-egg {
            background-color: #f3e6be;
        }
        .golden-easter-egg .phone-viewport {
            background-color: #fcf4db;
            background-image: 
                linear-gradient(rgba(235, 195, 115, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(235, 195, 115, 0.3) 1px, transparent 1px);
            border-color: #8c6200;
            box-shadow: 0 20px 50px rgba(140, 98, 0, 0.2), 12px 12px 0px #e0ca9b;
        }

        /* 视口内部的平滑滚动容器 */
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 35px 24px 30px;
            width: 100%;
            height: 100%;
            /* 隐藏滚动条但保留功能 */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* 内部核心纸卡片 —— 移除了多余的边框和阴影，完全融入最外层圆弧框 */
        .container {
            width: 100%; 
            background: transparent;
            padding: 0; 
            text-align: center; 
            position: relative; 
            z-index: 10;
        }

        h1 { font-size: 28px; color: #cc4c33; letter-spacing: 2px; font-weight: 900; margin-bottom: 8px; transition: color 0.5s; }
        .phone-viewport.golden-mode h1 { color: #b8860b; }
        .subtitle { font-size: 13px; color: #7b6865; margin-bottom: 30px; font-weight: 500; }
        
        /* 摇签区域 - 严格中轴线对称设计 */
        .cylinder-wrapper {
            height: 270px; position: relative; margin-bottom: 25px;
            display: flex; justify-content: center; align-items: flex-end;
        }
        /* 绝对居中对齐 */
        .stick-container {
            position: absolute; bottom: 110px; width: 140px; height: 130px;
            display: flex; justify-content: center; align-items: flex-end;
            left: 50%; transform: translateX(-50%);
        }
        .stick {
            width: 35px; height: 110px; background-color: #f5cf82; border: 3px solid #2b1f1d;
            border-radius: 8px 8px 0 0; margin: 0 -8px; transform-origin: bottom center;
            position: relative; box-shadow: -1px 0 0px #2b1f1d;
            transition: all 0.5s;
        }
        .phone-viewport.golden-mode .stick {
            border-color: #8c6200;
            background-color: #f7dfa6;
        }
        .stick::before {
            content: ''; position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%); width: 6px; height: 6px;
            background-color: #2b1f1d; border-radius: 50%;
        }
        .phone-viewport.golden-mode .stick::before { background-color: #8c6200; }
        
        /* 严格中轴线对称旋转偏角 */
        .stick:nth-child(1) { transform: rotate(-14deg) translateY(4px); background-color: #e8bd68; }
        .stick:nth-child(2) { transform: rotate(-7deg) translateY(-2px); background-color: #f7d692; }
        .stick:nth-child(3) { transform: rotate(0deg) translateY(2px); background-color: #eed08a; z-index: 6; }
        .stick:nth-child(4) { transform: rotate(7deg) translateY(-2px); background-color: #f5cf82; }
        .stick:nth-child(5) { transform: rotate(14deg) translateY(4px); background-color: #e5b85c; }

        .cylinder {
            width: 150px; height: 140px; background-color: #e85d44; border: 4px solid #2b1f1d;
            border-radius: 16px 16px 28px 28px; position: relative; z-index: 12;
            box-shadow: 5px 5px 0px #2b1f1d; display: flex; justify-content: center; align-items: center;
            transition: all 0.5s; margin: 0 auto;
        }
        .phone-viewport.golden-mode .cylinder {
            background-color: #d4af37;
            border-color: #8c6200;
            box-shadow: 5px 5px 0px #8c6200;
        }
        .cylinder::after {
            content: '万事皆宜'; position: absolute; padding: 8px 4px;
            background-color: #ffca3a; border: 3px solid #2b1f1d; border-radius: 6px;
            color: #2b1f1d; font-weight: 900; font-size: 15px;
            writing-mode: vertical-rl; text-orientation: upright;
            letter-spacing: 2px; box-shadow: 3px 3px 0 #2b1f1d;
            transition: all 0.5s;
        }
        .phone-viewport.golden-mode .cylinder::after {
            content: '提包跑路';
            background-color: #fff;
            border-color: #8c6200;
            color: #8c6200;
            box-shadow: 3px 3px 0 #8c6200;
        }

        /* 出签动画中轴线定位修正 */
        .lucky-stick-out {
            position: absolute; width: 45px; height: 150px; background-color: #118ab2;
            border: 4px solid #2b1f1d; bottom: 110px; z-index: 5;
            border-radius: 12px 12px 6px 6px; display: none;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15); transform-origin: bottom center;
            left: 50%; margin-left: -22.5px; /* 宽度45px的一半，实现完美中轴居中飞出 */
        }
        .lucky-stick-out::before {
            content: ''; position: absolute; top: 12px; left: 50%;
            transform: translateX(-50%); width: 8px; height: 8px;
            background-color: #2b1f1d; border-radius: 50%;
        }
        .lucky-stick-text {
            writing-mode: vertical-rl; text-orientation: upright; font-size: 13px;
            color: #fff; font-weight: 900; margin: 32px auto 0 auto; letter-spacing: 4px;
        }

        /* 动画群 */
        @keyframes handShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 4px) rotate(-10deg); }
            40% { transform: translate(8px, -4px) rotate(10deg); }
            60% { transform: translate(-6px, -2px) rotate(-8deg); }
            80% { transform: translate(6px, 2px) rotate(8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shaking { animation: handShake 0.4s ease-in-out infinite; }

        @keyframes stickBumpy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(-8deg); }
            66% { transform: translateY(4px) rotate(10deg); }
        }
        .sticks-shaking .stick:nth-child(1) { animation: stickBumpy 0.35s ease-in-out infinite; }
        .sticks-shaking .stick:nth-child(2) { animation: stickBumpy 0.35s ease-in-out infinite 0.07s; }
        .sticks-shaking .stick:nth-child(3) { animation: stickBumpy 0.35s ease-in-out infinite 0.14s; }
        .sticks-shaking .stick:nth-child(4) { animation: stickBumpy 0.35s ease-in-out infinite 0.21s; }
        .sticks-shaking .stick:nth-child(5) { animation: stickBumpy 0.35s ease-in-out infinite 0.28s; }

        @keyframes signFlyOut {
            0% { bottom: 110px; opacity: 0; transform: scale(0.6) rotate(-15deg); }
            60% { bottom: 230px; opacity: 1; transform: scale(1.1) rotate(5deg); }
            100% { bottom: 190px; opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .fly-out-anim { display: block !important; animation: signFlyOut 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* 基于手机视觉框内部定位的飘字动画 */
        @keyframes textFloatUp {
            0% { transform: translateY(0) scale(0.7); opacity: 0; }
            15% { opacity: 1; transform: translateY(-30px) scale(1.2); }
            80% { opacity: 0.9; }
            100% { transform: translateY(-220px) scale(0.95); opacity: 0; }
        }
        .floating-text {
            position: absolute;
            color: #cc4c33; font-weight: 900; font-size: 17px;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #2b1f1d;
            pointer-events: none;
            z-index: 999;
            animation: textFloatUp 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            display: flex; align-items: center; gap: 4px;
            white-space: nowrap;
        }
        .gold-style {
            color: #ffa200 !important;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #b25900 !important;
        }
        .luck-style {
            color: #ff3333 !important;
            text-shadow: 2px 2px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 3px 3px 0px #5c0000 !important;
        }

        .btn-draw {
            background-color: #ff6b6b; color: #fff; border: 4px solid #2b1f1d;
            padding: 13px 40px; font-size: 18px; font-weight: 900; border-radius: 20px;
            cursor: pointer; box-shadow: 4px 4px 0px #2b1f1d; letter-spacing: 2px;
            transition: all 0.2s; width: 100%;
        }
        .btn-draw:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0px #2b1f1d; }
        .btn-draw:disabled { background-color: #cbd5e1; color: #94a3b8; box-shadow: none; transform: none; border-color: #94a3b8; }

        .result-box {
            margin-top: 25px; min-height: 140px; padding: 20px 16px; border-radius: 20px;
            background-color: #dfd4c2; border: 3px solid #2b1f1d; box-shadow: 4px 4px 0px #c2b49e;
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .phone-viewport.golden-mode .result-box {
            background-color: #ede2c5; border-color: #8c6200; box-shadow: 4px 4px 0px #d5c6a1;
        }
        .result-title { font-size: 13px; font-weight: 700; color: #5a4946; margin-bottom: 8px; }
        .result-value { font-size: 25px; font-weight: 900; color: #cc4c33; margin-bottom: 4px; }
        .phone-viewport.golden-mode .result-value { color: #b8860b; }
        .result-tag { font-size: 11px; background: #cc4c33; color: #fff; padding: 2px 8px; border-radius: 20px; font-weight: bold; margin-bottom: 12px; display: none; letter-spacing: 1px; }
        .phone-viewport.golden-mode .result-tag { background: #b8860b; }
        .result-compliment { font-size: 13px; color: #4a3532; font-weight: 700; line-height: 1.6; background-color: #fffbf5; padding: 10px 12px; border-radius: 12px; border: 2px dashed #2b1f1d; max-width: 98%; text-align: left; }
        .phone-viewport.golden-mode .result-compliment { border-color: #8c6200; background-color: #fffff2; }
        
        .result-mission { font-size: 12px; color: #118ab2; font-weight: 700; margin-top: 10px; border-top: 1px dotted #cbd5e1; padding-top: 8px; width: 95%; text-align: left; display: none; }
        .result-midnight { font-size: 11px; color: #7b6865; font-weight: 500; margin-top: 8px; font-style: italic; display: none; line-height: 1.4; }
        .hint-text { font-size: 11px; color: #a3908c; margin-top: 15px; font-weight: 500; line-height: 1.5; text-align: center; }
        .almanac-text { font-size: 11px; color: #cc4c33; margin-top: 4px; font-weight: 700; text-align: center; }
    </style>
</head>

        ],
        "二楼中超": [

            "🍲 治愈力直接拉满！你挑选食材时的那份认真与讲究，是在为自己和生活搭建最坚实的幸福防御网！",
            "🍚 熟悉的饭香就是最强大的魔法！今天去挑选心仪的家乡风味，福气和胃口双双达到巅峰！"

            "✨ 🏁 满载而归的绝对主力！你推着手推车做决断的飒爽英姿，充分展示了对高品质生活游刃有余的驾驭能力！",

        "周五跑路大满贯": [
            "👑 降维打击！这是天赐的跑路神旨，既然触发了这 10% 的隐藏概率，今天就必须把所有烦恼统统全免甩到脑后！",
            "🌟 金光闪闪的至尊特赦！你今天的运气已经击败了全宇宙 99% 的打工人，顺应这个特赦彩蛋，高调迎接完全属于你的狂欢！",
            "🏁 满贯跑路，神仙撑腰！所有的焦虑、工作、纠结在这一刻被全部清空，带着你的特赦金牌，快乐出发！"

    const missionPool = [
        "💡 今日秘密任务：出门或散步时，数出 3 个穿红色上衣的路人，并在心里默默祝他们今天发大财。相信我，你的财运也会跟着翻倍！",
        "💡 今日秘密任务：去买东西或结账时，对收银员或者路过的人真诚微笑一下，用你的独特磁场去悄悄点亮别人的一天！",
        "💡 今日秘密任务：在目的地买一样平时绝对不怎么买的零食或小玩意，当作今天生活送给你的盲盒礼物！",
        "💡 今日秘密任务：一会出发时用左脚先迈出门。玄学表明，今天左脚出门能完美避开生活里的所有小磕碰！"
    ];

    const almanacPool = [
        ["🔮 宜：喝杯奶茶，看云发呆。忌：对账单叹气。", "✨ 宜：步伐嚣张，自信满满。忌：替别人瞎操心。"],
        ["☀️ 宜：大吃一顿，取悦自己. 忌：疯狂内耗。", "🍃 宜：保持快乐，拒绝加班. 忌：回复消息太快。"],
        ["🛡️ 宜：理直气壮，绝不背锅。忌：自我CPU。", "🪙 宜：高调吸金，闭眼买单。忌：疯狂省钱。"],
        ["🌸 宜：亲近自然，大口呼吸。忌：坐在椅子上生根。", "🚀 宜：火力全开，一气耗成。忌：磨磨唧唧拖延。"]
    ];

    let lastResult = "";
    let repeatCount = 0;
    let totalDrawsInShortTime = 0;
    let clickTimeBuffer = [];
    let sideToggle = true;

    function updateTimeHint() {
        const now = new Date();
        const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        document.getElementById('timeHint').innerText = `当前系统时间：${days[now.getDay()]} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        const poolIndex = now.getMinutes() % almanacPool.length;
        const subIndex = now.getSeconds() % 2;
        document.getElementById('almanacHint').innerText = almanacPool[poolIndex][subIndex];
    }
    
    // 修复问题1：工作时间段不再死锁唯一选项，而是依然可以抽取全部，但保留有趣的作息提示
    function getAvailablePool() {
        const now = new Date();
        const dayOfWeek = now.getDay(); 
        const currentHour = now.getHours();

        // 基础池
        let pool = ["请假休息", "随便转转", "公园散步", "巡视果园", "宿舍躺平", "IDEA", "老Maxi", "新Maxi", "Lilly", "DM", "明珠", "二楼中超", "银行取钱"];
        if (dayOfWeek >= 3 && dayOfWeek <= 6) { pool.push("Lidl"); }
        if (currentHour < 14) { pool.push("瓜果市场"); }

        if (dayOfWeek === 0) return { status: "sunday_rest" };

        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
            if (currentHour >= 9 && currentHour < 12) {
                return { status: "ready", data: pool, intercept: "💼 现正值晨间高效工作黄金期！虽然抽到了这个，但祖师爷还是悄悄暗示你用【IDEA】开启你无敌的逻辑风暴哦！" };
            }
            if (currentHour >= 12 && currentHour < 14) {
                return { status: "ready", data: pool, intercept: "🍱 呼呼！午休干饭干大觉时间到！不管摇到啥，快去整点好吃的或者狠狠躺平！" };
            }
            if (currentHour >= 14 && currentHour < 17) {
                return { status: "ready", data: pool, intercept: "🪐 午后能量攻坚战时间！打起精神，一会儿别忘了打开【IDEA】大杀四方，今晚准时下班！" };
            }
            if (currentHour >= 17 && currentHour < 19) {
                return { status: "ready", data: pool, intercept: "🏁 下班/放学铃声响起！自由的灵魂开始复苏，去逛超市、采购快乐吧！" };
            }
        }
        
        return { status: "ready", data: pool, intercept: null };
    }

    function createFloatingText() {
        const textSpan = document.createElement('span');
        textSpan.className = 'floating-text';
        
        const now = Date.now();
        clickTimeBuffer = clickTimeBuffer.filter(t => now - t < 2000);
        
        let pool = clickTimeBuffer.length > 6 ? fastShakeWords : poolWords;
        let selectedItem = pool[Math.floor(Math.random() * pool.length)];

        if (selectedItem.type === "gold") {
            textSpan.innerHTML = `🪙✨ ${selectedItem.text}`;
            textSpan.classList.add('gold-style');
        } else if (selectedItem.type === "luck") {
            textSpan.innerHTML = `🧧 福 ${selectedItem.text}`;
            textSpan.classList.add('luck-style');
        } else {
            textSpan.innerText = selectedItem.text;
        }

        const viewport = document.getElementById('viewportCard');
        const viewWidth = viewport.clientWidth;
        const viewHeight = viewport.clientHeight;
        let leftPos = 0;

        if (sideToggle) {
            leftPos = Math.random() * (viewWidth * 0.22) + 15;
        } else {
            leftPos = Math.random() * (viewWidth * 0.22) + (viewWidth * 0.72) - 15;
        }
        sideToggle = !sideToggle;

        let topPos = (viewHeight * 0.42) + (Math.random() * 60);

        textSpan.style.left = leftPos + 'px';
        textSpan.style.top = topPos + 'px';

        viewport.appendChild(textSpan);
        setTimeout(() => textSpan.remove(), 1200);
    }

    function startDraw() {
        clickTimeBuffer.push(Date.now());
        totalDrawsInShortTime++;

        const wrapper = document.getElementById('wrapper');
        const stickContainer = document.getElementById('stickContainer');
        const luckyStick = document.getElementById('luckyStick');
        const luckyStickText = document.getElementById('luckyStickText');
        const drawBtn = document.getElementById('drawBtn');
        const resultTitle = document.getElementById('resultTitle');
        const resultValue = document.getElementById('resultValue');
        const resultTag = document.getElementById('resultTag');
        const resultComp = document.getElementById('resultCompliment');
        const resultMission = document.getElementById('resultMission');
        const resultMidnight = document.getElementById('resultMidnight');
        const viewportCard = document.getElementById('viewportCard');
        
        document.body.classList.remove('golden-easter-egg');
        viewportCard.classList.remove('golden-mode');
        luckyStick.style.backgroundColor = "#118ab2";

        luckyStick.classList.remove('fly-out-anim');
        resultTitle.innerText = "灵签演道通玄奥，宝箓含神赐福祥...";
        resultValue.innerText = "⚡";
        resultTag.style.display = "none";
        resultComp.style.display = "none";
        resultMission.style.display = "none";
        resultMidnight.style.display = "none";
        drawBtn.disabled = true;

        wrapper.classList.add('shaking');
        stickContainer.classList.add('sticks-shaking');

        const intervalTime = clickTimeBuffer.length > 5 ? 100 : 160;
        const floatTimer = setInterval(createFloatingText, intervalTime);

        setTimeout(() => {
            clearInterval(floatTimer);
            wrapper.classList.remove('shaking');
            stickContainer.classList.remove('sticks-shaking');

            const nowTime = new Date();
            const poolResult = getAvailablePool();
            
            if (poolResult.status === "sunday_rest") {
                luckyStickText.innerText = "偷懒大吉";
                luckyStick.classList.add('fly-out-anim');
                setTimeout(() => {
                    resultTitle.innerText = "💤 【祖师爷偏心提示】";
                    resultValue.innerText = "今天放假，偷懒无罪！";
                    resultTag.innerText = "【神仙放假·特别定制签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = "✨ 今天是周日，天地磁场都在劝你理直气壮地躺平。不准焦虑、不准自我CPU，今天最大的任务就是把舒适度拉满，做个快乐的闲人！";
                    resultComp.style.display = "block";
                    drawBtn.innerText = "再摇一次功德";
                    drawBtn.style.backgroundColor = "#ffca3a"; drawBtn.style.color = "#2b1f1d";
                    drawBtn.disabled = false;
                }, 300);
                return;
            }

            if (nowTime.getDay() === 5 && Math.random() < 0.10) {
                luckyStickText.innerText = "全免跑路";
                luckyStick.style.backgroundColor = "#d4af37";
                luckyStick.classList.add('fly-out-anim');
                
                document.body.classList.add('golden-easter-egg');
                viewportCard.classList.add('golden-mode');

                setTimeout(() => {
                    resultTitle.innerText = "🏆 【神级暴运·天赐全免彩蛋】";
                    resultValue.innerText = "周五跑路大满贯！";
                    resultTag.innerText = signTags["周五跑路大满贯"];
                    resultTag.style.display = "inline-block";
                    
                    const compList = compliments["周五跑路大满贯"];
                    resultComp.innerText = compList[Math.floor(Math.random() * compList.length)];
                    resultComp.style.display = "block";
                    
                    resultMission.innerText = "💡 隐藏限定任务：立刻收拾包包，步伐嚣张地大步流星离开现场，一秒都不准多逗留！";
                    resultMission.style.display = "block";

                    drawBtn.innerText = "承蒙天意，高调跑路！";
                    drawBtn.style.backgroundColor = "#ffa200"; drawBtn.style.color = "#fff";
                    drawBtn.disabled = false;
                }, 300);
                return;
            }

            let currentPool = poolResult.data;
            const randomIndex = Math.floor(Math.random() * currentPool.length);
            let finalResult = currentPool[randomIndex];

            if (finalResult === lastResult) {
                repeatCount++;
            } else {
                repeatCount = 1;
                lastResult = finalResult;
            }

            luckyStickText.innerText = luckyIdioms[finalResult] || "今日宜行";
            luckyStick.classList.add('fly-out-anim');

            setTimeout(() => {
                if (repeatCount >= 3) {
                    resultTitle.innerText = "🔮 【抓包！命中注定的天意】";
                    resultValue.innerText = `${finalResult} (第${repeatCount}次)`;
                    resultTag.innerText = "【天道金牌·退无可退签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = `🤣 怎么又是【${finalResult}】？！本签筒都已经尽力帮你打乱顺序了，结果还是它！别嘴硬和抵抗啦，这就是命中注定的选择。赶紧收拾收拾，顺应天意高调出发！`;
                    resultComp.style.display = "block";
                } 
                else if (totalDrawsInShortTime >= 5) {
                    resultTitle.innerText = "👑 【天道强制特赦令】";
                    resultValue.innerText = `${finalResult}`;
                    resultTag.innerText = "【直接盲选·终结纠结签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = `👀 别再挑啦！祖师爷看你反复摇晃了 ${totalDrawsInShortTime} 次，代表你的纠结磁场快超标了！现在听话，不要想了，闭眼选【${finalResult}】作为你的终极答案，立刻出发去迎接快乐！`;
                    resultComp.style.display = "block";
                } 
                else if (poolResult.intercept) {
                    // 如果命中了时间段，且没有触发连续相同/连刷惩罚，则额外展示时间段的逗趣评语
                    resultTitle.innerText = "🎉 乾坤定夺！今日宜 ——";
                    resultValue.innerText = `${finalResult}`;
                    resultTag.innerText = signTags[finalResult] || "【天赐上上签】";
                    resultTag.style.display = "inline-block";
                    resultComp.innerText = `${poolResult.intercept}\n\n（针对本次结果评语）：${compliments[finalResult][Math.floor(Math.random() * compliments[finalResult].length)]}`;
                    resultComp.style.display = "block";
                }
                else {
                    resultTitle.innerText = "🎉 乾坤定夺！今日宜 ——";
                    resultValue.innerText = `${finalResult}`;
                    resultTag.innerText = signTags[finalResult] || "【天赐上上签】";
                    resultTag.style.display = "inline-block";
                    
                    const compList = compliments[finalResult];
                    resultComp.innerText = compList[Math.floor(Math.random() * compList.length)];
                    resultComp.style.display = "block";
                }

                resultMission.innerText = missionPool[Math.floor(Math.random() * missionPool.length)];
                resultMission.style.display = "block";

                const now = new Date();
                if (now.getHours() >= 23 || now.getHours() < 5) {
                    resultMidnight.innerText = "🌙 (悄悄话：现在已经是深夜啦。不管今天摇到了去哪儿，现在的首要任务是盖好被子睡觉觉。明天睡醒了，好运自会陪你一同出发。晚安，全世界最棒的你。)";
                    resultMidnight.style.display = "block";
                }
                
                drawBtn.innerText = "不服气，再请一签";
                drawBtn.style.backgroundColor = "#4caf50"; drawBtn.style.color = "#fff";
                drawBtn.disabled = false;
            }, 300);

        }, 1100);
    }

    setInterval(() => { totalDrawsInShortTime = 0; }, 300000);
    updateTimeHint();
    setInterval(updateTimeHint, 60000);
</script>
