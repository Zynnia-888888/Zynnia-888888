<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>灵瑞问签筒</title>
    <style>
        /* --- 高阶 UI 视觉设计 --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1c20 0%, #2a2e35 100%);
            --cylinder-color: linear-gradient(180deg, #a67c52 0%, #7d522a 50%, #543111 100%);
            --paper-bg: radial-gradient(circle, #fcf8f2 0%, #f4ebd9 100%);
            --accent-gold: #dfb76c;
            --text-dark: #3a352a;
        }

        /* 隐藏彩蛋金色皮肤 */
        .gold-theme {
            --bg-gradient: linear-gradient(135deg, #4a3718 0%, #1f1607 100%);
            --cylinder-color: linear-gradient(180deg, #ffd700 0%, #b8860b 50%, #7851a9 100%);
            --accent-gold: #fff3cc;
            text-shadow: 0 0 8px rgba(255,215,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            color: #fff;
            padding: 20px;
            transition: background 1s ease;
        }

        /* 国风云纹背景装饰 */
        .bg-deco {
            position: absolute;
            top: 5%;
            width: 90%;
            height: 90%;
            border: 1px solid rgba(223, 183, 108, 0.15);
            pointer-events: none;
            z-index: 1;
        }

        /* 顶部提示 */
        .header-hint {
            z-index: 2;
            text-align: center;
            margin-top: 15px;
        }
        .header-hint h1 {
            font-size: 24px;
            letter-spacing: 4px;
            color: var(--accent-gold);
            margin-bottom: 8px;
            font-weight: 400;
        }
        .header-hint p {
            font-size: 13px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* 中轴线动画核心容器 */
        .stage {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* 确保签筒彻底居中对齐 */
        .cylinder-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 260px;
            cursor: pointer;
        }

        /* 签筒立体美化 */
        .cylinder {
            width: 100%;
            height: 100%;
            background: var(--cylinder-color);
            border-radius: 12px 12px 24px 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            border: 2px solid var(--accent-gold);
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* 签筒顶部阴影深邃感 */
        .cylinder::before {
            content: '';
            position: absolute;
            top: 0;
            width: 100%;
            height: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px 10px 0 0;
        }

        /* 签筒内部的竹签们 */
        .sticks {
            position: absolute;
            bottom: 40px;
            width: 80px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: transform 0.1s ease;
        }

        .stick {
            width: 6px;
            height: 160px;
            background: #d0a374;
            border-radius: 3px 3px 0 0;
            margin: 0 -1px;
            border: 1px solid #9c6d43;
            transform-origin: bottom center;
        }
        .stick:nth-child(odd) { height: 170px; background: #c29566; }
        .stick:nth-child(3n) { transform: rotate(4deg); }
        .stick:nth-child(3n+1) { transform: rotate(-4deg); }
        .stick:nth-child(5n) { transform: rotate(2deg); }

        /* --- 正中轴线摇晃动画 --- */
        @keyframes shakeAxis {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            15% { transform: translate(-50%, -53%) rotate(8deg); }
            30% { transform: translate(-50%, -47%) rotate(-8deg); }
            45% { transform: translate(-50%, -52%) rotate(6deg); }
            60% { transform: translate(-50%, -48%) rotate(-6deg); }
            75% { transform: translate(-50%, -51%) rotate(3deg); }
            90% { transform: translate(-50%, -49%) rotate(-3deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        .shaking {
            animation: shakeAxis 0.5s ease-in-out infinite;
        }

        /* 跃出的单根竹签 */
        .lucky-stick {
            position: absolute;
            width: 12px;
            height: 190px;
            background: #be2323;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            opacity: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .lucky-stick span {
            color: #fff;
            font-size: 10px;
            writing-mode: vertical-rl;
            letter-spacing: 2px;
            font-weight: bold;
        }

        @keyframes stickOut {
            0% { transform: translateX(-50%) translateY(50px); opacity: 0; }
            50% { transform: translateX(-50%) translateY(-60px) rotate(5deg); opacity: 1; }
            100% { transform: translateX(-50%) translateY(10px); opacity: 0; }
        }
        .stick-anim {
            animation: stickOut 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* --- 手机端现代国风圆弧倒角视觉框 --- */
        .result-mask {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 24px;
        }
        .result-mask.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 重点优化：大圆弧倒角柔边视觉框 */
        .result-card {
            background: var(--paper-bg);
            border: 1px solid rgba(138, 109, 59, 0.3);
            border-radius: 24px; /* 契合手机端高阶全面屏的圆弧倒角 */
            width: 100%;
            max-width: 330px;
            padding: 32px 24px;
            color: var(--text-dark);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(223, 183, 108, 0.2);
            position: relative;
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        .result-mask.show .result-card {
            transform: scale(1);
        }

        /* 内部圆弧勾边，形成双层层次感 */
        .result-card::after {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px dashed rgba(138, 109, 59, 0.25);
            border-radius: 18px; /* 内部同步圆弧 */
            pointer-events: none;
        }

        .result-location {
            font-size: 22px;
            font-weight: 600;
            color: #be2323;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px dashed rgba(138, 109, 59, 0.3);
            padding-bottom: 12px;
        }

        .result-poem {
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
            font-weight: 500;
            margin-bottom: 22px;
            color: #2b2b2b;
        }

        .result-analysis {
            font-size: 14px;
            line-height: 1.6;
            color: #4a4a4a;
            background: rgba(138, 109, 59, 0.06);
            padding: 16px;
            border-radius: 14px; /* 内部板块圆弧倒角 */
            margin-bottom: 24px;
            text-align: left;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: #be2323;
            color: #fff;
            border: none;
            padding: 12px 36px;
            font-size: 14px;
            letter-spacing: 2px;
            border-radius: 50px; /* 胶囊圆弧形按钮，完美适配现代UI */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(190,35,35,0.3);
            font-weight: 500;
            transition: background 0.2s;
        }
        .close-btn:active {
            background: #9a1c1c;
        }

        /* 底部说明 */
        .footer-info {
            z-index: 2;
            font-size: 12px;
            opacity: 0.4;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-deco"></div>

    <div class="header-hint">
        <h1 id="title-text">灵瑞问签筒</h1>
        <p id="flow-hint">凝神静气，摇晃签筒或轻触问卜</p>
    </div>

    <div class="stage">
        <div class="cylinder-wrapper" id="cylinderWrapper">
            <div class="cylinder">
                <div class="sticks">
                    <div class="stick"></div><div class="stick"></div><div class="stick"></div>
                    <div class="stick"></div><div class="stick"></div><div class="stick"></div>
                    <div class="stick"></div><div class="stick"></div><div class="stick"></div>
                </div>
            </div>
            <div class="lucky-stick" id="luckyStick">
                <span>灵签既出</span>
            </div>
        </div>
    </div>

    <div class="footer-info">天地时序 · 随心问卜</div>

    <div class="result-mask" id="resultMask">
        <div class="result-card">
            <div class="result-location" id="resLocation">-</div>
            <div class="result-poem" id="resPoem">-</div>
            <div class="result-analysis" id="resAnalysis">-</div>
            <button class="close-btn" onclick="closeResult()">承领此签</button>
        </div>
    </div>

    <script>
        // --- 完全中立、零状态假设、纯地理与自然描摹的文案池 ---
        const poolData = {
            "请假休息": [
                { poem: "久在樊笼里，复得返自然。", text: "空间指示：此去宜归向自处之境，闭门谢客，或于静止中观察周遭物理变化。" },
                { poem: "身在此山中，云深不知处。", text: "空间指示：当前利于切断向外传导的射线，处于隐匿、留白与不可见的状态中。" }
            ],
            "Lidl": [
                { poem: "满筐圆实骊珠滑，入口甘香冰玉寒。", text: "空间指示：地缘向西或西南，属于货殖流通、物资聚合之所，利于观察生活物资的罗列。" },
                { poem: "日中集市乾坤大，物华天宝各西东。", text: "空间指示：前往多流线、多标价的现世流转地，可在规律的货架动线中完成一次空间穿梭。" }
            ],
            "随便转转": [
                { poem: "步履无心随处好，风光不墨画图新。", text: "空间指示：不设定经纬度与目的地。随外部地势起伏而移动，随机截取下一刻撞见的环境断面。" },
                { poem: "流水下山非有意，片云归洞本无心。", text: "空间指示：当前处于无阻尼的状态。不设动线规划，视线落在何处，脚步即向何处衍生。" }
            ],
            "公园散步": [
                { poem: "林深时见鹿，溪午不闻钟。", text: "空间指示：走向含有林木、泥土与开阔空间的绿色生态场。在这里，声音的传播频率将因植物的吸附而发生改变。" },
                { poem: "清风拂面不胜轻，独步草青意自平。", text: "空间指示：户外开阔环境。头顶无人工建筑遮挡，视野地平线无限延伸，适合物理空间上的匀速位移。" }
            ],
            "巡视果园": [
                { poem: "枝头累累皆因果，静待时时造化功。", text: "空间指示：前往含有生命孕育周期、植物正在挂果或处于成熟期的观测点，见证时间在客观物质上的留痕。" },
                { poem: "满园葱郁皆生意，静看造物运乾坤。", text: "空间指示：此方空间具有强烈的向下扎根属性。适合观察叶绿素与水分在土壤环境中的静态表达。" }
            ],
            "宿舍躺平": [
                { poem: "一榻清风天地阔，半窗明月心神闲。", text: "空间指示：处于私密且具有边界的固定方寸内。躯体保持水平重力分布，视线与天花板平行。" },
                { poem: "虚室生白吉祥地，闭门即是深山中。", text: "空间指示：拉起物理阻隔（窗帘/门锁），在独立构筑的立方体空间内，切断一切外部声光干扰。" }
            ],
            "IDEA": [
                { poem: "灵台无物常通达，智刃闪烁断纷纭。", text: "空间指示：利于开展逻辑推演、秩序重组或对复杂代码、信息的深度解析，处于极高密度的脑部交互状态。" },
                { poem: "千淘万漉虽辛苦，吹尽狂沙始到金。", text: "空间指示：当前的场景适合面对那些繁复、细碎、高结构化的任务，通过纠错与修正完成逻辑闭环。" }
            ],
            "老Maxi": [
                { poem: "古朴货架藏旧岁，人间烟火最抚心。", text: "空间指示：前往一处具备时间累积感、货品结构极其稳定的传统大型物理空间，动线熟悉，少有未知干扰。" },
                { poem: "旧地重游意自如，所需皆在方寸间。", text: "空间指示：高确定性的熟稔场所。不需要应对任何突发的新视觉刺激，按部就班即可获取所需物质。" }
            ],
            "新Maxi": [
                { poem: "琳琅满目开新境，气象万千驻心头。", text: "空间指示：现代、高挑高、强采光的大型复合商业空间。流线设计充满现代工业律动，视觉明快。" },
                { poem: "宏阔空间宽视野，推陈出新运转换。", text: "空间指示：处于宽敞、宽步道、光影折射率高的空间。物理视野的骤然开阔，利于转换长期处于逼仄环境的视线。" }
            ],
            "Lilly": [
                { poem: "暗香浮动因风起，明镜妆台照素华。", text: "空间指示：前往注重身体微观感知、气味分子浓度高、或者提供个表修饰物资的局部精致空间。" },
                { poem: "精致生活无别法，细微深处见真淳。", text: "空间指示：把注意力回收至个体的表皮层与细微气味上。此去所涉环境，色彩通常呈现出轻快、柔和的调性。" }
            ],
            "DM": [
                { poem: "万物条理皆井然，随心取用最相宜。", text: "空间指示：强实用主义、高分类精细度的现代生活补给站。其陈列规律极度严谨，极易寻找对应物。" },
                { poem: "草本清香安神魄，日常点滴润身心。", text: "空间指示：充斥着植物提取液、日常护理试剂的标准化零售场所，可在微量元素的排列组合中游走。" }
            ],
            "瓜果市场": [
                { poem: "红杏碧桃依绿水，新丝青蔓绕荒畦。", text: "空间指示：大自然高含水量、高色彩饱和度产物的集散中心。在这里可以直观触碰到高频的生命新陈代谢痕迹。" },
                { poem: "五色斑斓皆生意，饱满多汁运亨通。", text: "空间指示：空气中带有果酸与植物纤维的天然混合气味，适合在此空间内调动最基础的色泽与嗅觉感知。" }
            ],
            "明珠": [
                { poem: "沧海月明珠有泪，蓝田日暖玉生烟。", text: "空间指示：带有特定东方饮食文化或传统地缘风味符号的磁场空间，适合寻觅具有血脉熟悉度的特定物质。" },
                { poem: "风味不改初心在，珍重人间聚散时。", text: "空间指示：在特定的风味环境中，热量通过食物介质完成物理层面的转移，能使身体指标获得最直接的充盈。" }
            ],
            "二楼中超": [
                { poem: "琼楼玉宇藏珍货，百味翻腾会心笑。", text: "空间指示：物理高度需要拾级而上。在这个需要垂直位移才能抵达的空间内，存留着大量熟悉的地缘特产。" },
                { poem: "拾级而上风光异，此中滋味自心知。", text: "空间指示：转换高度，向垂直上方的空间探索。在带有浓厚熟悉包裹感的氛围里，完成一次物质的获取。" }
            ]
        };

        // 金色隐藏彩蛋
        const goldEgg = {
            location: "【天道乾坤 · 万象皆空】",
            poem: "天道清明，万缘放下；今日无羁，云淡风轻。",
            analysis: "规序提示：触发十里挑一的【万象皆空】概率。在此时空维度下，不设规律，不受限制，无需符合任何空间或作息定义，万物皆在自由态，任你自流转。"
        };

        let isShaking = false;

        // --- 基于“纯粹时间与自然时序”的物理闭合拦截 ---
        function getAvailablePool() {
            const now = new Date();
            const day = now.getDay(); 
            const hour = now.getHours();

            // 1. 周日天道静止
            if (day === 0) {
                return { error: true, title: "【天地闭合 · 乾坤休歇】", msg: "规序提示：时轮运转至周日，此阶段为签筒闭合期。今日无方向指示，世界处于无为运转状态。" };
            }

            // 2. 深夜物理闭合（凌晨 00:00 - 05:59）
            if (hour >= 0 && hour < 6) {
                return { error: true, title: "【子夜归藏 · 灵台藏光】", msg: "规序提示：时轮运转至子夜与晨曦交界。此时空段签筒不作输出，请等待光线回归地表。" };
            }
            
            let list = [];
            for (let key in poolData) {
                if (key === "Lidl" && (day < 3 || day > 6)) continue;
                if ((key === "瓜果market" || key === "瓜果市场") && hour >= 14) continue;
                list.push(key);
            }

            return { error: false, list: list };
        }

        function startLottery() {
            if (isShaking) return;

            const res = getAvailablePool();
            if (res.error) {
                document.getElementById('resLocation').innerText = res.title;
                document.getElementById('resPoem').innerText = "静若止水，动若脱兔。";
                document.getElementById('resAnalysis').innerText = res.msg;
                document.getElementById('resultMask').classList.add('show');
                return;
            }

            isShaking = true;
            const wrapper = document.getElementById('cylinderWrapper');
            const luckyStick = document.getElementById('luckyStick');
            
            wrapper.classList.add('shaking');

            setTimeout(() => {
                wrapper.classList.remove('shaking');
                luckyStick.classList.add('stick-anim');

                setTimeout(() => {
                    showResult(res.list);
                }, 800);

            }, 1200);
        }

        function showResult(validList) {
            const now = new Date();
            const day = now.getDay();
            
            let finalLocation = "";
            let finalPoem = "";
            let finalAnalysis = "";

            if (day === 5 && Math.random() < 0.10) {
                document.body.classList.add('gold-theme');
                document.getElementById('title-text').innerText = "✨ 灵瑞金光筒 ✨";
                
                finalLocation = goldEgg.location;
                finalPoem = goldEgg.poem;
                finalAnalysis = goldEgg.analysis;
            } else {
                const randomLocation = validList[Math.floor(Math.random() * validList.length)];
                const poems = poolData[randomLocation];
                const randomPoemObj = poems[Math.floor(Math.random() * poems.length)];

                finalLocation = `位置：${randomLocation}`;
                finalPoem = `「 ${randomPoemObj.poem} 」`;
                finalAnalysis = randomPoemObj.text;
            }

            document.getElementById('resLocation').innerText = finalLocation;
            document.getElementById('resPoem').innerText = finalPoem;
            document.getElementById('resAnalysis').innerText = finalAnalysis;
            
            document.getElementById('resultMask').classList.add('show');
        }

        function closeResult() {
            document.getElementById('resultMask').classList.remove('show');
            const luckyStick = document.getElementById('luckyStick');
            luckyStick.classList.remove('stick-anim');
            
            setTimeout(() => {
                isShaking = false;
            }, 400);
        }

        document.getElementById('cylinderWrapper').addEventListener('click', startLottery);

        // 原生手机摇一摇支持
        let lastX = 0, lastY = 0, lastZ = 0;
        let lastUpdate = 0;
        const SHAKE_THRESHOLD = 800;

        function deviceMotionHandler(eventData) {
            let acceleration = eventData.accelerationIncludingGravity;
            let curTime = new Date().getTime();
            
            if ((curTime - lastUpdate) > 100) {
                let diffTime = curTime - lastUpdate;
                lastUpdate = curTime;
                
                let speed = Math.abs(acceleration.x + acceleration.y + acceleration.z - lastX - lastY - lastZ) / diffTime * 10000;
                if (speed > SHAKE_THRESHOLD) {
                    startLottery();
                }
                lastX = acceleration.x;
                lastY = acceleration.y;
                lastZ = acceleration.z;
            }
        }

        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', deviceMotionHandler, false);
        }
    </script>
</body>
</html>
