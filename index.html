<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>道观摇签筒</title>
    <style>
        /* 全局国风优雅底色 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Serif SC", serif;
            background: linear-gradient(135deg, #f5f2eb 0%, #e8e3d7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        /* 👑 核心视觉：最外围包围环绕内容的倒角圆弧框 */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: rgba(253, 252, 248, 0.95);
            border-radius: 24px; /* 保持手机端圆弧倒角视觉框 */
            padding: 30px 24px;
            box-shadow: 
                0 4px 10px rgba(139, 119, 93, 0.1),
                0 16px 40px rgba(139, 119, 93, 0.15),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6); /* 高阶微光流边 */
            position: relative;
            text-align: center;
            overflow: hidden;
        }

        /* 顶部标题与状态 */
        .header {
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 24px;
            color: #8c2423; /* 朱砂红 */
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .status-badge {
            display: inline-block;
            font-size: 11px;
            background-color: #f1ede2;
            color: #7a6e5b;
            padding: 3px 10px;
            border-radius: 12px;
            margin-top: 4px;
        }

        /* 签筒展示区（去除原有的内部边框，完全悬浮融入大框中） */
        .divination-zone {
            position: relative;
            height: 230px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 木签群容器（绝对中轴对称居中） */
        .stick-container {
            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            transition: transform 0.1s;
            z-index: 2;
        }
        .stick {
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 110px;
            background: linear-gradient(to top, #cc9952 0%, #e6be7e 80%, #bb1e1e 100%);
            border-radius: 4px 4px 0 0;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.15);
            transform-origin: bottom center;
        }
        /* 5根竹签扇形对称发散布局 */
        .stick:nth-child(1) { left: 20px; transform: rotate(-14deg); }
        .stick:nth-child(2) { left: 40px; transform: rotate(-7deg); }
        .stick:nth-child(3) { left: 60px; transform: rotate(0deg); }
        .stick:nth-child(4) { left: 80px; transform: rotate(7deg); }
        .stick:nth-child(5) { left: 100px; transform: rotate(14deg); }

        /* 摇签筒外观（纯色与光泽，剔除多余装饰线） */
        .cylinder {
            position: relative;
            width: 125px;
            height: 140px;
            background: linear-gradient(135deg, #a62424 0%, #801a1a 100%);
            border-radius: 0 0 16px 16px;
            box-shadow: 0 8px 20px rgba(128, 26, 26, 0.3);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cylinder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: #d4af37; /* 鎏金边 */
            border-radius: 2px 2px 0 0;
        }
        .cylinder-text {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
            writing-mode: vertical-rl;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 飞出的幸运签动画（完美居中飞出） */
        .lucky-stick-out {
            position: absolute;
            bottom: 80px;
            left: 50%;
            width: 14px;
            height: 150px;
            background: linear-gradient(to top, #d4af37 0%, #f3e5ab 100%);
            border-radius: 6px 6px 2px 2px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            z-index: 5;
            display: none;
            transform-origin: bottom center;
        }
        .lucky-stick-text {
            color: #a62424;
            font-size: 9px;
            font-weight: bold;
            writing-mode: vertical-rl;
            margin: 15px auto 0 auto;
            letter-spacing: 1px;
        }

        /* 签筒晃动动画 */
        @keyframes shake {
            0% { transform: translateX(-50%) rotate(0deg); }
            15% { transform: translateX(-55%) rotate(-8deg); }
            30% { transform: translateX(-45%) rotate(7deg); }
            45% { transform: translateX(-53%) rotate(-6deg); }
            60% { transform: translateX(-47%) rotate(5deg); }
            75% { transform: translateX(-51%) rotate(-3deg); }
            90% { transform: translateX(-49%) rotate(2deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        .shaking {
            animation: shake 0.6s ease-in-out infinite;
        }

        /* 出签抛物线动画 */
        @keyframes flyOut {
            0% { transform: translateX(-50%) translateY(0) scale(0.8); opacity: 0; }
            40% { transform: translateX(-50%) translateY(-100px) scale(1.1); opacity: 1; }
            70% { transform: translateX(-50%) translateY(-75px) scale(1.05); }
            100% { transform: translateX(-50%) translateY(-85px) scale(1.1); box-shadow: 0 10px 25px rgba(212, 175, 55, 0.6); }
        }
        .flying {
            display: block !important;
            animation: flyOut 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 抽签按钮 */
        .btn-pray {
            width: 80%;
            max-width: 240px;
            background: linear-gradient(to right, #b83b3a, #8c2423);
            color: #fdfcf8;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 36, 35, 0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .btn-pray:active {
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(140, 36, 35, 0.3);
        }
        .btn-pray:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 结果展示区域（去除嵌套框，仅通过柔和阴影和背景达成留白层次） */
        .result-box {
            margin-top: 25px;
            min-height: 130px;
            padding: 20px 16px;
            border-radius: 16px;
            background-color: #fdfdfc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .result-box.active {
            background-color: #fffaf2;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.12);
        }
        .result-title {
            font-size: 18px;
            color: #a62424;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-poem {
            font-size: 14px;
            color: #665e52;
            font-style: italic;
            line-height: 1.6;
            white-space: pre-line;
        }
        .placeholder-text {
            color: #a3998a;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* 底部系统信息反馈 */
        .footer-info {
            margin-top: 25px;
            font-size: 11px;
            color: #a3998a;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header">
            <h1>有求必应签筒</h1>
            <div class="status-badge" id="current-time-badge">正在获取今日运势...</div>
        </div>

        <div class="divination-zone">
            <div class="lucky-stick-out" id="lucky-stick">
                <div class="lucky-stick-text" id="lucky-stick-text">幸运签</div>
            </div>

            <div class="stick-container" id="stick-container">
                <div class="stick"></div>
                <div class="stick"></div>
                <div class="stick"></div>
                <div class="stick"></div>
                <div class="stick"></div>
            </div>
            <div class="cylinder" id="cylinder-body">
                <div class="cylinder-text">今日去哪</div>
            </div>
        </div>

        <button class="btn-pray" id="btn-shake" onclick="startDivination()">虔诚摇签</button>

        <div class="result-box" id="result-box">
            <div class="placeholder-text" id="placeholder-msg">洗手静心，按下上方按钮祈愿</div>
            <div class="result-title" id="result-title" style="display: none;"></div>
            <div class="result-poem" id="result-poem" style="display: none;"></div>
        </div>

        <div class="footer-info" id="pool-preview">
            天机流转，每日签池依时而变
        </div>

    </div>

    <script>
        // 1. 词条池定义与古风签解打油诗库
        const POEM_DATABASE = {
            "请假休息": "身心俱疲叹红尘，暂卸繁华闭山门。高卧榻上面南面，偷得浮生半日闲。",
            "Lidl": "熬过三更见晓晴，巧逢佳期出大营。琳琅满目皆资粮，满载而归步轻盈。",
            "随便转转": "漫步庭前看落花，无拘无束任天涯。清风拂面不知远，随缘随喜即为家。",
            "公园散步": "绿柳依依拂碧泉，青山隐隐入晴烟。偷闲最爱林间路，一步一清静自然。",
            "巡视果园": "春华秋实万重山，硕果满枝压翠鬟。亲执藤鞭巡领地，得享丰收展笑颜。",
            "宿舍躺平": "万事无忧且掩扉，红尘滚滚任它非。舒心展背高枕卧，梦回大唐不思归。",
            "IDEA": "孤灯夜半坐长庭，灵感穿梭点繁星。架构通达乾坤大，功成破壁写仙经。",
            "老Maxi": "故地重游旧街坊，仓廪丰实岁流长。熟门熟路皆良货，心满意足自生香。",
            "新Maxi": "宏图新展气象新，百货云集迎贵宾。步履初登探宝地，琳琅满目悦身心。",
            "Lilly": "芬芳流溢漫瑶台，玉液琼浆次第开。巧手妆点倾城色，红颜一笑百花羞。",
            "DM": "生活细碎皆学问，格物致知万物新。日用百般皆齐备，惠而不费最怡人。",
            "瓜果市场": "清晨破晓集晨光，紫燕衔红瓜果香。莫待日中车马散，早登仙界好商量。",
            "明珠": "掌上明珠耀眼明，流光溢彩映仙庭。探得珍宝心中喜，不虚此行伴月行。",
            "二楼中超": "拾级而上见家乡，满阁皆是故土香。珍馐百味抚羁旅，游子归家暖胃肠。"
        };

        // 2. 核心过滤逻辑：根据当前时间和星期动态生成签池
        function generateDailyPool() {
            const now = new Date();
            const day = now.getDay();       // 0=周日, 1=周一, ..., 6=周六
            const hour = now.getHours();     // 0-23小时

            // 周日默认休息拦截标记
            if (day === 0) {
                return { isSunday: true, pool: [] };
            }

            // 常规基础词条
            let pool = [
                "请假休息", "随便转转", "公园散步", "巡视果园", 
                "宿舍躺平", "IDEA", "老Maxi", "新Maxi", 
                "Lilly", "DM", "明珠", "二楼中超"
            ];

            // 限制条件1: Lidl 只有熬过了周三才会触发 (即周三、周四、周五、周六可用)
            if (day >= 3 && day <= 6) {
                pool.push("Lidl");
            }

            // 限制条件2: 瓜果市场只有下午2点 (14:00) 之前开放
            if (hour < 14) {
                pool.push("瓜果市场");
            }

            return { isSunday: false, pool: pool };
        }

        // 3. 页面初始化状态呈现
        function initPage() {
            const now = new Date();
            const daysStr = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            const timeString = `${now.getMonth()+1}月${now.getDate()}日 ${daysStr[day=now.getDay()]} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            
            const badge = document.getElementById("current-time-badge");
            const btn = document.getElementById("btn-shake");
            const poolPreview = document.getElementById("pool-preview");
            
            const status = generateDailyPool();

            if (status.isSunday) {
                badge.innerText = `${timeString} 【玄门闭关】`;
                badge.style.backgroundColor = "#e2e8f0";
                badge.style.color = "#64748b";
                
                btn.disabled = true;
                btn.innerText = "今日闭关休息";
                
                document.getElementById("placeholder-msg").innerText = "⚠️ 周日祖师爷休息，今日不宜抽签，请宿舍躺平安心休养。";
                poolPreview.innerText = "今日签池：周日不提供抽签";
            } else {
                badge.innerText = `${timeString} 运势流转中`;
                poolPreview.innerText = `今日签池共 ${status.pool.length} 灵签 (已包含当前时间生效词条)`;
            }
        }

        // 4. 执行求签交互动画与结果抽取
        let isShaking = false;
        function startDivination() {
            if (isShaking) return;
            
            const status = generateDailyPool();
            if (status.isSunday) return;

            isShaking = true;
            
            // UI 重置
            document.getElementById("btn-shake").disabled = true;
            document.getElementById("lucky-stick").classList.remove("flying");
            document.getElementById("result-box").classList.remove("active");
            
            document.getElementById("placeholder-msg").style.display = "block";
            document.getElementById("placeholder-msg").innerText = "🔮 诚心摇晃签筒，静候天机显现...";
            document.getElementById("result-title").style.display = "none";
            document.getElementById("result-poem").style.display = "none";

            // 触发签条群晃动
            const stickContainer = document.getElementById("stick-container");
            stickContainer.classList.add("shaking");

            // 1.2秒后停止晃动，抛出幸运签
            setTimeout(() => {
                stickContainer.classList.remove("shaking");
                
                // 随机抽取一个词条
                const pool = status.pool;
                const luckyLocation = pool[Math.floor(Math.random() * pool.length)];
                const luckyPoem = POEM_DATABASE[luckyLocation] || "天机不泄，随缘而行。";

                // 设置飞出签条的文字
                document.getElementById("lucky-stick-text").innerText = luckyLocation;
                document.getElementById("lucky-stick").classList.add("flying");

                // 0.6秒飞签动画结束后呈现下方文字卡片
                setTimeout(() => {
                    document.getElementById("placeholder-msg").style.display = "none";
                    
                    const titleEl = document.getElementById("result-title");
                    const poemEl = document.getElementById("result-poem");
                    const boxEl = document.getElementById("result-box");

                    titleEl.innerText = `【 上上签：${luckyLocation} 】`;
                    poemEl.innerText = luckyPoem;

                    titleEl.style.display = "block";
                    poemEl.style.display = "block";
                    boxEl.classList.add("active");

                    // 恢复按钮
                    document.getElementById("btn-shake").disabled = false;
                    isShaking = false;
                }, 600);

            }, 1200);
        }

        // 执行初始化
        window.onload = initPage;
    </script>
</body>
</html>
