<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天机万事筒</title>
    <style>
        /* 基础复古宣纸风画布 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4edd8;
            background-image: radial-gradient(rgba(230,215,185,0.4) 1px, transparent 0),
                              radial-gradient(rgba(230,215,185,0.4) 1px, transparent 0);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2b1f1d;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        /* 顶部古典标题区 */
        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            color: #cc4c33;
            margin: 0 0 8px 0;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px #fff;
        }
        .header p {
            font-size: 13px;
            color: #7b6865;
            margin: 0;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: #cc4c33;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* 交互环境主体舞台 */
        .stage {
            width: 100%;
            height: 280px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 25px;
        }

        /* 扁平手绘签筒组件 */
        .cylinder-wrapper {
            position: relative;
            cursor: pointer;
            transform-origin: bottom center;
            z-index: 10;
        }
        
        /* 内部集成的粗厚木牌签群 */
        .stick-pool {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .stick-in-pool {
            width: 24px;
            height: 100px;
            background-color: #e59866;
            border: 3px solid #2b1f1d;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            margin: 0 -5px;
            transform-origin: bottom center;
            position: relative;
            box-sizing: border-box;
        }
        .stick-in-pool::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }
        /* 多彩堆叠感 */
        .stick-in-pool:nth-child(1) { transform: rotate(-15deg); background-color: #f5b041; }
        .stick-in-pool:nth-child(2) { transform: rotate(-7deg); background-color: #f4d03f; height: 105px; z-index: 2;}
        .stick-in-pool:nth-child(3) { transform: rotate(0deg); background-color: #eb984e; height: 110px; z-index: 3;}
        .stick-in-pool:nth-child(4) { transform: rotate(8deg); background-color: #f4d03f; height: 103px; z-index: 2;}
        .stick-in-pool:nth-child(5) { transform: rotate(18deg); background-color: #f5b041; }

        /* 外观大签筒 */
        .cylinder {
            width: 150px;
            height: 140px;
            background-color: #e85d44;
            border: 4px solid #2b1f1d;
            border-radius: 0 0 25px 25px;
            box-shadow: 6px 6px 0px #2b1f1d;
            position: relative;
            overflow: visible;
            box-sizing: border-box;
        }
        .cylinder::after {
            content: "万事皆宜";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            border: 3px solid #2b1f1d;
            padding: 8px 14px;
            font-size: 16px;
            font-weight: 900;
            color: #2b1f1d;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 3px 3px 0px #2b1f1d;
            letter-spacing: 2px;
        }
        .cylinder-rim {
            position: absolute;
            top: 0;
            left: -4px;
            width: 150px;
            height: 16px;
            background-color: #ffbe0b;
            border: 4px solid #2b1f1d;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* 飞出的宽大吉签 */
        .lucky-stick {
            position: absolute;
            bottom: 40px;
            left: 50%;
            width: 52px;
            height: 185px;
            background-color: #ffbe0b;
            border: 4px solid #2b1f1d;
            border-radius: 12px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.15);
            display: none;
            z-index: 5;
            box-sizing: border-box;
            padding: 12px 4px;
            transform-origin: center center;
        }
        .lucky-stick-inner {
            width: 100%;
            height: 100%;
            border: 2px dashed #2b1f1d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            position: relative;
        }
        .lucky-stick-hole {
            width: 6px;
            height: 6px;
            background-color: #2b1f1d;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .lucky-stick-text {
            font-size: 18px;
            font-weight: 900;
            color: #2b1f1d;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 5px;
        }

        /* 摇签按钮 */
        .btn-draw {
            background-color: #ff6b6b;
            color: #fff;
            border: 4px solid #2b1f1d;
            padding: 14px 45px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #2b1f1d;
            letter-spacing: 2px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.1s;
        }
        .btn-draw:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #2b1f1d;
        }
        .btn-draw:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: 4px 4px 0px #94a3b8;
        }

        /* 结果卡片 */
        .result-box {
            margin-top: 30px;
            width: 100%;
            min-height: 140px;
            padding: 22px;
            border-radius: 24px;
            background-color: #fdfcf7;
            border: 4px solid #2b1f1d;
            box-shadow: 5px 5px 0px #eedcc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            text-align: center;
        }
        .result-title {
            font-size: 22px;
            font-weight: 900;
            color: #cc4c33;
            margin-bottom: 4px;
        }
        .result-tag {
            font-size: 11px;
            background: #cc4c33;
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            display: none;
            letter-spacing: 1px;
        }
        .result-compliment {
            font-size: 14px;
            color: #4a3532;
            font-weight: 700;
            line-height: 1.6;
            background-color: #fff5e6;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px dashed #2b1f1d;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }

        /* 完美严格对称轴线老黄历结构 */
        .almanac-card {
            width: 100%;
            margin-top: 25px;
            background-color: #fdfcf7;
            border: 4px solid #2b1f1d;
            border-radius: 24px;
            padding: 18px 16px;
            box-sizing: border-box;
            box-shadow: 5px 5px 0px #eedcc5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .almanac-header {
            font-size: 16px;
            font-weight: 900;
            color: #2b1f1d;
            margin-bottom: 14px;
            letter-spacing: 2px;
        }
        /* 古典粗木纹双实线包裹体 */
        .almanac-body {
            width: 100%;
            border-top: 4px double #2b1f1d;
            border-bottom: 4px double #2b1f1d;
            padding: 14px 0;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }
        /* 左右平分：确保文字对齐在物理轴心线上 */
        .almanac-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 0 4px;
        }
        .almanac-section:first-child {
            border-right: 2px dashed #2b1f1d;
        }
        /* 规范化高级国潮撞色 */
        .almanac-label {
            font-size: 18px;
            font-weight: 900;
            padding: 3px 14px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: inline-block;
            letter-spacing: 1px;
            border: 2px solid #2b1f1d;
        }
        .almanac-section.yi .almanac-label {
            background-color: #e2f4e9;
            color: #1b8a5a; /* 复古翡翠绿 */
            box-shadow: 2px 2px 0px #1b8a5a;
        }
        .almanac-section.ji .almanac-label {
            background-color: #fce8e6;
            color: #cc4c33; /* 复古朱砂红 */
            box-shadow: 2px 2px 0px #cc4c33;
        }
        .almanac-list {
            font-size: 14px;
            font-weight: 800;
            color: #2b1f1d;
            line-height: 2.0;
        }
        .almanac-item {
            margin: 4px 0;
            white-space: nowrap;
        }

        /* 系统实时显示 */
        .footer-time {
            margin-top: 25px;
            font-size: 11px;
            color: #7b6865;
            font-weight: bold;
            background-color: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(43,31,29,0.1);
        }

        /* 氛围漂移文字 */
        .floating-text {
            position: absolute;
            font-size: 14px;
            font-weight: 900;
            color: #ffae19;
            text-shadow: 1px 1px 0px #2b1f1d;
            opacity: 0;
            z-index: 99;
            pointer-events: none;
        }

        /* 动画配置 */
        @keyframes handShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-8px, 3px) rotate(-6deg); }
            20% { transform: translate(6px, -4px) rotate(7deg); }
            30% { transform: translate(-7px, 2px) rotate(-5deg); }
            40% { transform: translate(5px, -3px) rotate(6deg); }
            50% { transform: translate(-6px, 4px) rotate(-6deg); }
            60% { transform: translate(6px, -2px) rotate(5deg); }
            70% { transform: translate(-4px, 1px) rotate(-4deg); }
            80% { transform: translate(4px, -3px) rotate(4deg); }
            90% { transform: translate(-2px, 2px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .anim-shake {
            animation: handShake 1.1s ease-in-out infinite;
        }

        @keyframes stickBumpy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-22px) rotate(-8deg); }
            50% { transform: translateY(5px) rotate(4deg); }
            75% { transform: translateY(-18px) rotate(6deg); }
        }
        .anim-bumpy {
            animation: stickBumpy 0.28s ease-in-out infinite;
        }

        @keyframes stickFlyOut {
            0% { transform: translate(-50%, 0) scale(0.4) rotate(0deg); opacity: 0; display: block; bottom: 40px; }
            50% { transform: translate(-50%, -150px) scale(1.1) rotate(180deg); opacity: 1; }
            75% { transform: translate(-50%, -110px) scale(1.05) rotate(370deg); opacity: 1; }
            100% { transform: translate(-50%, -120px) scale(1) rotate(360deg); opacity: 1; bottom: 40px; }
        }
        .anim-flyout {
            animation: stickFlyOut 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes textFloatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
            80% { opacity: 0.9; }
            100% { transform: translateY(-70px) scale(0.9); opacity: 0; }
        }
    </style>
</head>
<body>

        <div class="header">
            <h1>天机万事筒</h1>
            <p>诚心问卜 · 指点今日生活去向</p>
        </div>

        <div class="stage">
            <div class="cylinder-wrapper" id="cylinderWrapper">
                <div class="stick-pool" id="stickPool">
                    <div class="stick-in-pool"></div>
                    <div class="stick-in-pool"></div>
                    <div class="stick-in-pool"></div>
                    <div class="stick-in-pool"></div>
                    <div class="stick-in-pool"></div>
                </div>
                <div class="cylinder">
                    <div class="cylinder-rim"></div>
                </div>
            </div>
            <div class="lucky-stick" id="luckyStick">
                <div class="lucky-stick-inner">
                    <div class="lucky-stick-hole"></div>
                    <div class="lucky-stick-text" id="luckyStickText">出行</div>
                </div>
            </div>
        </div>

        <button class="btn-draw" id="btnDraw" onclick="startDivination()">虔诚摇签</button>

        <div class="result-box">

            <div class="result-title" id="resultTitle">摇动万事筒以窥天机</div>
            <div class="result-compliment" id="resultCompliment">每日出门、抉择或纠结前，不妨平心静气摇晃签筒。不设限、不贴标签，用积极舒畅的心态开启当下的生活。</div>
        </div>

        <div class="almanac-card">
            <div class="almanac-header">📅 今日生活万事历</div>
            <div class="almanac-body">
                <div class="almanac-section yi">
                    <div class="almanac-label">宜</div>

                        </div>
                </div>
                <div class="almanac-section ji">
                    <div class="almanac-label">忌</div>
                    <div class="almanac-list" id="almanacJiList">
                        </div>
                </div>
            </div>
        </div>

        <div class="footer-time" id="footerTime">当前系统时间：载入中...</div>

    </div>

            "瓜果市场": [
                "踩着时间节点出发的你太准时了！这里充满了生活最本真的烟火气，新鲜饱满的色彩看一眼就让人心情大好！",
                "午后前的限定快乐！去挑选那些刚出水灵、带着大自然生气的瓜果，咬一口都是满满的香甜与元气。",
                "最接地气的元气补充站。看着摊位上色彩斑斓的水果，生活的幸福感就是简单而直接！"
            ],
            "明珠": [
                "衣食住行的大卖场中超！这里就像是一个无所不包的宝藏基地，无论你想找寻什么家乡风味或生活必需，它都能一站式满足你，逛完安全感爆棚！",
                "作为能解决衣食住行一切需求的超级大卖场，明珠总能带给你无与伦比的归属感。进去转一圈，把生活所需的能量和物资一次性补充满满！",
                "在明珠这个包罗万象的大卖场里，熟悉的食物、齐全的百货总能瞬间治愈一切。这不仅是一次采购，更是一场给生活全方位充电的满足之旅！"
            ],
            "二楼中超": [
                "这里是专门置办生活家具、鞋包服饰的宝藏根据地。上去兜一圈，琳琅满目的实用居家物件、舒适的服饰鞋包，总能让你的私人生活空间和日常穿搭焕然一新！",
                "抛开琐碎，今天去二楼置办几件舒心好看的衣服鞋包，或者淘一些贴心实用的生活小家具。把日常起居的环境打点得精致妥帖，也是爱生活的一种超棒方式！",
                "极具针对性的探索旅程！在这个主打鞋包服饰与生活家具的专属层，挑选让居家和出行都更舒适的日常装备。看着被布置得更温馨的私人空间，满足感直接拉满。"
            ]
        };

        const sundayCompliment = "今天是专属于全身心休养的节点。万事筒也进入了静谧状态，不宜进行任何抉择与出行。平心静气、睡到自然醒、安稳地舒展身体，才是今天最正经、最舒适的头等大事！";

        const weekdayFloatTexts = {
            1: ["好运加持✨", "保持松弛🧘", "心态超稳💎", "今天真好看🌟"],
            2: ["元气满满🔋", "生活万岁🎉", "平和喜乐🌈", "状态极佳✨"],
            3: ["顺遂顺心!✨", "能量回满🔋", "允许放松☕", "渐入佳境🍁"],
            4: ["曙光在前☀️", "心情明朗😎", "自我关怀💖", "自在舒畅🎉"],
            5: ["自在快乐🎈", "心情飞起🚀", "好运连连🧧", "快乐满格🔋"],
            6: ["享受当下☕", "生活由我🎨", "惬意舒适✨", "万事皆宜🧧"]
        };

        // 彻底去除人群划分、普适大众、纯粹关注身心行为的精选词条池
        const yiItems = ["舒缓拉伸", "发呆五分钟", "听喜欢的歌", "看窗外远眺", "喝杯温热茶", "深呼吸清心", "奖励个小零食", "整理私人空间", "保持平和心态"];
        const jiItems = ["步伐太急躁", "情绪紧紧绷绷", "过度焦虑未来", "与无聊事较真", "强行勉强自己", "忽视身体信号", "盲目做大决定", "生活节奏打乱", "精神过度内耗"];

        window.onload = function() {
            updateSystemTimeAndAlmanac();
            setInterval(updateSystemTimeAndAlmanac, 1000);
        };

        function updateSystemTimeAndAlmanac() {
            const now = new Date();
            const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dayOfWeek = now.getDay();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('footerTime').innerText = `当前系统时间：${days[dayOfWeek]} ${hours}:${minutes}:${seconds}`;

            const btn = document.getElementById('btnDraw');
            if (dayOfWeek === 0) {
                btn.disabled = true;
                btn.innerText = "今日休息";
                renderStaticAlmanac(["安心躺平", "彻底放松", "睡到自然醒"], ["生活急躁", "情绪紧绷", "过度内耗"]);
            } else {
                btn.disabled = false;
                btn.innerText = "虔诚摇签";
                
                // 确保精选的核心无标签词条必然出现在最前面，绝不限制任何特定人群
                let dailyYi = ["舒缓拉伸", "发呆五分钟", "听喜欢的歌"];
                let dailyJi = ["步伐太急躁", "情绪紧紧绷绷", "过度焦虑未来"];
                
                // 再随机各填充2个补充
                while(dailyYi.length < 5) {
                    let r = yiItems[Math.floor(Math.random() * yiItems.length)];
                    if(!dailyYi.includes(r)) dailyYi.push(r);
                }
                while(dailyJi.length < 5) {
                    let r = jiItems[Math.floor(Math.random() * jiItems.length)];
                    if(!dailyJi.includes(r)) dailyJi.push(r);
                }
                renderStaticAlmanac(dailyYi, dailyJi);
            }
        }

        function renderStaticAlmanac(yiArr, jiArr) {
            document.getElementById('almanacYiList').innerHTML = yiArr.map(i => `<div class="almanac-item">${i}</div>`).join('');
            document.getElementById('almanacJiList').innerHTML = jiArr.map(i => `<div class="almanac-item">${i}</div>`).join('');
        }

        function spawnFloatingText() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const wordBank = weekdayFloatTexts[dayOfWeek] || ["福运+", "顺遂+", "开心+"];
            
            const container = document.querySelector('.container');
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const textNode = document.createElement('div');
                    textNode.className = 'floating-text';
                    textNode.innerText = wordBank[Math.floor(Math.random() * wordBank.length)];
                    
                    const randomX = Math.random() * 260 + 40;
                    const randomY = Math.random() * 120 + 80;
                    
                    textNode.style.left = `${randomX}px`;
                    textNode.style.top = `${randomY}px`;
                    textNode.style.animation = 'textFloatUp 0.9s ease-out forwards';
                    
                    container.appendChild(textNode);
                    setTimeout(() => textNode.remove(), 900);
                }, i * 150);
            }
        }

        let isDrawing = false;
        function startDivination() {
            if (isDrawing) return;

            const now = new Date();
            const dayOfWeek = now.getDay();
            const currentHour = now.getHours();

            if (dayOfWeek === 0) {
                document.getElementById('resultTitle').innerText = "今日不宜抽签";
                document.getElementById('resultCompliment').innerText = sundayCompliment;
                document.getElementById('resultTag').style.display = "none";
                return;
            }

            isDrawing = true;
            document.getElementById('btnDraw').disabled = true;

            document.getElementById('luckyStick').style.display = "none";
            document.getElementById('luckyStick').classList.remove('anim-flyout');
            document.getElementById('resultTag').style.display = "none";
            document.getElementById('resultTitle').innerText = "正在窥弄天机...";
            document.getElementById('resultCompliment').innerText = "虔诚祈愿，签筒摇晃中。正在根据此时此刻的时间流转，为你过滤命定之中的生活去向...";

            document.getElementById('cylinderWrapper').classList.add('anim-shake');
            document.getElementById('stickPool').classList.add('anim-bumpy');

            spawnFloatingText();

            setTimeout(() => {
                document.getElementById('cylinderWrapper').classList.remove('anim-shake');
                document.getElementById('stickPool').classList.remove('anim-bumpy');

                let availableLocations = [];
                const baseItems = ["请假休息", "随便转转", "公园散步", "巡视果园", "宿舍躺平", "IDEA", "老Maxi", "新Maxi", "Lilly", "DM", "明珠", "二楼中超"];
                availableLocations.push(...baseItems);

                if (dayOfWeek >= 3 && dayOfWeek <= 6) {
                    availableLocations.push("Lidl");
                }

                if (currentHour < 14) {
                    availableLocations.push("瓜果市场");
                }

                const finalChoice = availableLocations[Math.floor(Math.random() * availableLocations.length)];
                
                let shortName = finalChoice;
                if(shortName === "二楼中超") shortName = "鞋包服饰";
                if(shortName === "请假休息") shortName = "休整";
                if(shortName === "宿舍躺平") shortName = "躺平";
                if(shortName === "瓜果市场") shortName = "瓜果";
                document.getElementById('luckyStickText').innerText = shortName;

                const luckyStick = document.getElementById('luckyStick');
                luckyStick.style.display = "block";
                luckyStick.classList.add('anim-flyout');

                const complimentsList = pools[finalChoice];
                const selectedCompliment = complimentsList[Math.floor(Math.random() * complimentsList.length)];

                setTimeout(() => {
                    document.getElementById('resultTag').innerText = "上上大吉签";
                    document.getElementById('resultTag').style.display = "inline-block";
                    document.getElementById('resultTitle').innerText = `【今日去向：${finalChoice}】`;
                    document.getElementById('resultCompliment').innerText = selectedCompliment;

                    document.getElementById('btnDraw').disabled = false;
                    isDrawing = false;
                }, 400);

            }, 1200);
        }
    </script>
</body>
</html>
