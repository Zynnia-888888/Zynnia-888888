<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时来运转</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7eedf;
            background-image: 
                linear-gradient(rgba(224, 211, 192, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(224, 211, 192, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #fffdf9;
            padding: 40px 20px 30px;
            border-radius: 32px;
            border: 4px solid #2b1f1d;
            box-shadow: 8px 8px 0px #cfbda3;
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 28px;
            color: #cc4c33;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: #7b6865;
            margin-bottom: 40px;
            font-weight: 500;
        }
        
        /* 摇签区域 */
        .cylinder-wrapper {
            height: 280px;
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .stick-container {
            position: absolute;
            bottom: 110px;
            width: 140px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .stick {
            width: 35px;
            height: 110px;
            background-color: #f5cf82;
            border: 3px solid #2b1f1d;
            border-radius: 8px 8px 0 0;
            margin: 0 -10px;
            transform-origin: bottom center;
            position: relative;
            box-shadow: -2px 0 0px #2b1f1d;
        }
        .stick::before {
            content: '';
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 6px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }
        
        .stick:nth-child(1) { transform: rotate(-15deg) translateY(5px); background-color: #e8bd68; }
        .stick:nth-child(2) { transform: rotate(-7deg) translateY(-2px); background-color: #f7d692; }
        .stick:nth-child(3) { transform: rotate(-2deg) translateY(3px); background-color: #eed08a; }
        .stick:nth-child(4) { transform: rotate(5deg) translateY(-5px); background-color: #f5cf82; }
        .stick:nth-child(5) { transform: rotate(12deg) translateY(2px); background-color: #e5b85c; }

        .cylinder {
            width: 150px;
            height: 140px;
            background-color: #e85d44;
            border: 4px solid #2b1f1d;
            border-radius: 16px 16px 28px 28px;
            position: relative;
            z-index: 10;
            box-shadow: 5px 5px 0px #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cylinder::after {
            content: '万事皆宜';
            position: absolute;
            padding: 8px 4px;
            background-color: #ffca3a;
            border: 3px solid #2b1f1d;
            border-radius: 6px;
            color: #2b1f1d;
            font-weight: 900;
            font-size: 15px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
