        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7eedf;

            background-size: 20px 20px;
            color: #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #fffdf9;
            padding: 40px 20px 30px;
            border-radius: 32px;
            border: 4px solid #2b1f1d;
            box-shadow: 8px 8px 0px #cfbda3;
            text-align: center;
            position: relative;
            overflow: hidden; /* 防止飘字动画溢出 */
        }
        h1 {
            font-size: 28px;
            color: #cc4c33;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: #7b6865;
            margin-bottom: 40px;
            font-weight: 500;
        }
        
        /* 摇签区域 */
        .cylinder-wrapper {
            height: 280px;
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .stick-container {
            position: absolute;
            bottom: 110px;
            width: 140px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .stick {
            width: 35px;
            height: 110px;
            background-color: #f5cf82;
            border: 3px solid #2b1f1d;
            border-radius: 8px 8px 0 0;
            margin: 0 -10px;
            transform-origin: bottom center;
            position: relative;
            box-shadow: -2px 0 0px #2b1f1d;
        }
        .stick::before {
            content: '';
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 6px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }
        
        .stick:nth-child(1) { transform: rotate(-15deg) translateY(5px); background-color: #e8bd68; }
        .stick:nth-child(2) { transform: rotate(-7deg) translateY(-2px); background-color: #f7d692; }
        .stick:nth-child(3) { transform: rotate(-2deg) translateY(3px); background-color: #eed08a; }
        .stick:nth-child(4) { transform: rotate(5deg) translateY(-5px); background-color: #f5cf82; }
        .stick:nth-child(5) { transform: rotate(12deg) translateY(2px); background-color: #e5b85c; }

        .cylinder {
            width: 150px;
            height: 140px;
            background-color: #e85d44;
            border: 4px solid #2b1f1d;
            border-radius: 16px 16px 28px 28px;
            position: relative;
            z-index: 10;
            box-shadow: 5px 5px 0px #2b1f1d;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cylinder::after {
            content: '万事皆宜';
            position: absolute;
            padding: 8px 4px;
            background-color: #ffca3a;
            border: 3px solid #2b1f1d;
            border-radius: 6px;
            color: #2b1f1d;
            font-weight: 900;
            font-size: 15px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 2px;
            box-shadow: 3px 3px 0 #2b1f1d;
        }

        .lucky-stick-out {
            position: absolute;
            width: 45px;
            height: 150px;
            background-color: #118ab2;
            border: 4px solid #2b1f1d;
            bottom: 110px;
            z-index: 5;
            border-radius: 12px 12px 6px 6px;
            display: none;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.15);
            transform-origin: center;
        }
        .lucky-stick-out::before {
            content: '';
            position: absolute;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 8px;
            background-color: #2b1f1d;
            border-radius: 50%;
        }
        .lucky-stick-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 13px;
            color: #fff;
            font-weight: 900;
            margin: 32px auto 0 auto;
            letter-spacing: 4px;
        }

        /* 动画群 */
        @keyframes handShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-12px, 6px) rotate(-14deg); }
            40% { transform: translate(10px, -4px) rotate(12deg); }
            60% { transform: translate(-10px, -2px) rotate(-10deg); }
            80% { transform: translate(8px, 4px) rotate(8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shaking { animation: handShake 0.4s ease-in-out infinite; }

        @keyframes stickBumpy {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-25px) rotate(-12deg); }
            66% { transform: translateY(5px) rotate(15deg); }
        }
        .sticks-shaking .stick { animation: stickBumpy 0.35s ease-in-out infinite; }
        .sticks-shaking .stick:nth-child(even) { animation-delay: 0.1s; }

        @keyframes 牌飞出 {
            0% { bottom: 110px; opacity: 0; transform: scale(0.6) rotate(-45deg); }
            60% { bottom: 230px; opacity: 1; transform: scale(1.1) rotate(15deg); }
            100% { bottom: 190px; opacity: 1; transform: scale(1) rotate(5deg); }
        }
        .fly-out-anim {
            display: block !important;
            animation: 牌飞出 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 新增：功德飘字动画 */
        @keyframes textFloatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
            100% { transform: translateY(-80px) scale(1); opacity: 0; }
        }
        .floating-text {
            position: absolute;
            color: #e8bd68;
            font-weight: 900;
            font-size: 16px;
            text-shadow: 1px 1px 0 #2b1f1d;
            pointer-events: none;
            z-index: 100;
            animation: textFloatUp 0.8s ease-out forwards;
        }

        /* 基础组件 */
        .btn-draw {
            background-color: #ff6b6b;
            color: #fff;
            border: 4px solid #2b1f1d;
            padding: 14px 50px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #2b1f1d;
            letter-spacing: 2px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-draw:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #2b1f1d;
        }
        .btn-draw:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: pointer; /* 保持手势让周日点击有反馈 */
            box-shadow: none;
            transform: none;
        }

        .result-box {
            margin-top: 30px;
            min-height: 140px;
            padding: 20px;
            border-radius: 20px;
            background-color: #fdfcf7;
            border: 3px solid #2b1f1d;
            box-shadow: 4px 4px 0px #eedcc5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .result-title {
            font-size: 13px;
            font-weight: 700;
            color: #7b6865;
            margin-bottom: 8px;
        }
        .result-value {
            font-size: 26px;
            font-weight: 900;
            color: #cc4c33;
            margin-bottom: 4px;
        }
        /* 新增：灵签吉言小标签样式 */
        .result-tag {
            font-size: 11px;
            background: #cc4c33;
            color: #fff;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            display: none;
            letter-spacing: 1px;
        }
        .result-compliment {
            font-size: 14px;
            color: #4a3532;
            font-weight: 700;
            line-height: 1.6;
            background-color: #fff5e6;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px dashed #2b1f1d;
            max-width: 95%;
            text-align: left;
        }
        .hint-text {
            font-size: 11px;
            color: #a3908c;
            margin-top: 15px;
            font-weight: 500;
            line-height: 1.5;
        }
        .almanac-text {
            font-size: 11px;
            color: #cc4c33;
            margin-top: 4px;
            font-weight: 700;
        }
    </style>
</head>

    function updateTimeHint() {
        const now = new Date();
        const days = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        document.getElementById('timeHint').innerText = `当前系统时间：${days[now.getDay()]} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        
        // 动态老黄历变化
        const almanacIndex = now.getMinutes() % almanacPool.length;
        document.getElementById('almanacHint').innerText = almanacPool[almanacIndex];
    }
    
    function getAvailablePool() {
        const now = new Date();
        const dayOfWeek = now.getDay(); 
        const currentHour = now.getHours();

        if (dayOfWeek === 0) {
            return { status: "empty", reason: "周日默认大休息！老实躺平充电吧~" };
        }

        let pool = [
            "请假休息", "随便转转", "公园散步", "巡视果园", 
            "宿舍躺平", "IDEA", "老Maxi", "新Maxi", 
            "Lilly", "DM", "明珠", "二楼中超", "银行取钱"
        ];

        if (dayOfWeek >= 3 && dayOfWeek <= 6) { pool.push("Lidl"); }
        if (currentHour < 14) { pool.push("瓜果市场"); }

        return { status: "ready", data: pool };
    }

    // 新增：产生“功德+1”等飘字互动效果
    function createFloatingText() {
        const container = document.getElementById('mainContainer');
        const textSpan = document.createElement('span');
        textSpan.className = 'floating-text';
        
        // 随机选择词汇
        const randomWord = shakeWords[Math.floor(Math.random() * shakeWords.length)];
        textSpan.innerText = randomWord;

        // 在筒子周围随机定个位
        textSpan.style.left = (Math.random() * 100 + 120) + 'px';
        textSpan.style.bottom = (Math.random() * 40 + 200) + 'px';

        container.appendChild(textSpan);
        setTimeout(() => textSpan.remove(), 800);
    }

    function startDraw() {
        const wrapper = document.getElementById('wrapper');
        const stickContainer = document.getElementById('stickContainer');
        const luckyStick = document.getElementById('luckyStick');
        const luckyStickText = document.getElementById('luckyStickText');
        const drawBtn = document.getElementById('drawBtn');
        const resultTitle = document.getElementById('resultTitle');
        const resultValue = document.getElementById('resultValue');
        const resultTag = document.getElementById('resultTag');
        const resultComp = document.getElementById('resultCompliment');

        const poolResult = getAvailablePool();
        
        // 周日点击调皮反馈
        if (poolResult.status === "empty") {
            resultTitle.innerText = "💤 【祖师爷提示】";
            resultValue.innerText = "周日强摇签筒，木签可是会卡住的哦！";
            resultTag.style.display = "none";
            resultComp.innerText = "✨ 天意让引入注目、充满生活智慧的你今天彻底放松。别纠结了，今天最大的任务就是心安理得地躺平！";
            resultComp.style.display = "block";
            return;
        }

        luckyStick.classList.remove('fly-out-anim');
        resultTitle.innerText = "灵签演道通玄奥，宝箓含神赐福祥...";
        resultValue.innerText = "⚡";
        resultTag.style.display = "none";
        resultComp.style.display = "none";
        drawBtn.disabled = true;

        wrapper.classList.add('shaking');
        stickContainer.classList.add('sticks-shaking');

        // 摇晃期间隔产生功德飘字，增强点击解压爽感
        const floatTimer = setInterval(createFloatingText, 200);

        setTimeout(() => {
            clearInterval(floatTimer);
            wrapper.classList.remove('shaking');
            stickContainer.classList.remove('sticks-shaking');

            const currentPool = poolResult.data;
            const randomIndex = Math.floor(Math.random() * currentPool.length);
            const finalResult = currentPool[randomIndex];

            luckyStickText.innerText = luckyIdioms[finalResult] || "今日宜行";
            luckyStick.classList.add('fly-out-anim');

            setTimeout(() => {
                resultTitle.innerText = "🎉 乾坤定夺！今日宜 ——";
                resultValue.innerText = `${finalResult}`;
                
                // 展现新增的花式趣味上上签标签
                resultTag.innerText = signTags[finalResult] || "【天赐上上签】";
                resultTag.style.display = "inline-block";
                
                const compList = compliments[finalResult];
                const randomCompIndex = Math.floor(Math.random() * compList.length);
                
                resultComp.innerText = compList[randomCompIndex];
                resultComp.style.display = "block";
                
                drawBtn.disabled = false;
            }, 300);

        }, 1100);
    }
